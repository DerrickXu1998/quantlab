[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# The warehouse schema and `quantlab migrate`, nothing else. Data ingestion,
# providers and the research library live in quantlab-data-pipeline
# (`quantlab-data`); the application is backend/ (its own package and image).
[project]
name = "quantlab"
version = "0.2.0"
description = "The quantlab warehouse schema: Postgres + ClickHouse migrations and their runner."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "psycopg[binary]>=3.1",
    "clickhouse-connect>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff"]

[project.scripts]
quantlab = "quantlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# Migrations ship with the package so `quantlab migrate` works from an
# installed wheel, not just a source checkout.
[tool.setuptools.package-data]
"quantlab.store" = ["migrations/*.sql", "ch_migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
