services:
  # ---------------------------------------------------------------------------
  # Bars. Append-only, columnar, intraday-ready. Holds price_bars and nothing
  # else -- identity and provenance live in Postgres, which has the constraints.
  # ---------------------------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    environment:
      CLICKHOUSE_USER: quantlab
      CLICKHOUSE_PASSWORD: quantlab
      CLICKHOUSE_DB: quantlab
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - quantlab-chdata:/var/lib/clickhouse
    ports:
      # Loopback-only: credentials are local-development defaults, so the
      # databases must not be reachable from other hosts on the network.
      - "127.0.0.1:8123:8123"   # HTTP, what clickhouse-connect uses
      - "127.0.0.1:9000:9000"   # native protocol, for clickhouse-client
    ulimits:
      # ClickHouse opens a lot of files; the Docker default is too low and it
      # degrades quietly rather than failing loudly.
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      # 127.0.0.1, not localhost: inside the container localhost resolves to
      # ::1 and the server listens on IPv4, so the probe would never connect.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Catalog. Instruments, vendor symbol maps, universe snapshots, ingest
  # provenance, corporate actions. Small, relational, constraint-enforced.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: quantlab
      POSTGRES_PASSWORD: quantlab
      POSTGRES_DB: quantlab
      # Deterministic collation: index order must not depend on the host locale.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - quantlab-pgdata:/var/lib/postgresql/data
    ports:
      # Exposed so a notebook or psql on the host can reach the same database
      # the stack uses. Credentials are local-development only, so the
      # binding is loopback-only to keep them off the network.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantlab -d quantlab"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Schema owner. Runs on every `up`, exits when the database matches the
  # migrations on disk. Ingest and backend both wait for it.
  # ---------------------------------------------------------------------------
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.ingest
    # Shared tag with `ingest`: same Dockerfile, so pin the same image name or
    # Compose builds two independent copies and `build ingest` silently leaves
    # this one stale -- which will then apply an out-of-date schema.
    image: quantlab-ingest:latest
    command: ["migrate"]
    environment:
      QUANTLAB_DB_URL: ${QUANTLAB_DB_URL:-postgresql://quantlab:quantlab@postgres:5432/quantlab}
      QUANTLAB_CH_URL: ${QUANTLAB_CH_URL:-clickhouse://quantlab:quantlab@clickhouse:8123/quantlab}
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    restart: "no"

  # ---------------------------------------------------------------------------
  # Historical data ingest. Not part of `up` -- it reaches out to Stooq/Yahoo,
  # so it runs on demand (`make ingest SYMBOLS="AAPL.US MSFT.US"`).
  # ---------------------------------------------------------------------------
  ingest:
    build:
      context: .
      dockerfile: Dockerfile.ingest
    image: quantlab-ingest:latest   # see the note on `migrate`
    profiles: ["ingest"]
    environment:
      QUANTLAB_DB_URL: ${QUANTLAB_DB_URL:-postgresql://quantlab:quantlab@postgres:5432/quantlab}
      QUANTLAB_CH_URL: ${QUANTLAB_CH_URL:-clickhouse://quantlab:quantlab@clickhouse:8123/quantlab}
      QUANTLAB_HOME: /var/lib/quantlab
      # SEC and other sources want a real contact address; override in .env.
      QUANTLAB_USER_AGENT: ${QUANTLAB_USER_AGENT:-quantlab/0.1 (research)}
      # Credentialed ingest jobs read these from the environment; set them in
      # .env (all free to obtain -- see docs/DATA_SOURCES.md). Empty means the
      # job fails fast with a clear "set ..." message.
      SEC_USER_AGENT: ${SEC_USER_AGENT:-}
      FRED_API_KEY: ${FRED_API_KEY:-}
      COMPANIES_HOUSE_API_KEY: ${COMPANIES_HOUSE_API_KEY:-}
    volumes:
      - quantlab-cache:/var/lib/quantlab
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"

  # ---------------------------------------------------------------------------
  # Synthetic demo seed (SQLite). Kept so `make up` still produces a working
  # UI with no network access; the real data path is postgres + ingest.
  # ---------------------------------------------------------------------------
  seed:
    build:
      context: ./backend
      target: dev   # shares the backend service's image layers; see above
    command: ["python", "-m", "quantlab.seed"]
    profiles: ["demo"]
    environment:
      QUANTLAB_DB: /data/quantlab.db
      QUANTLAB_DB_PATH: /data/quantlab.db
    volumes:
      - quantlab-data:/data
    restart: "no"

  # ---------------------------------------------------------------------------
  # Event bus. Kafka API, single binary, no JVM. Only runs under the
  # `streaming` profile (`docker compose --profile streaming up`), so the base
  # stack is unchanged. The publisher (ingest image, `make replay-publish`)
  # turns warehouse history into a chronological bar stream on the topic; the
  # backend consumes it for GET /api/v1/replay/live/stream.
  # ---------------------------------------------------------------------------
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.18
    profiles: ["streaming"]
    command:
      - redpanda
      - start
      - --mode
      - dev-container
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --overprovisioned
      - --node-id
      - "0"
      - --check=false
      # Two listeners on one broker: compose-network traffic talks to
      # redpanda:9092, host traffic to localhost:19092. The advertised address
      # is what clients reconnect to after bootstrap, so both must be listed.
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092,OUTSIDE://localhost:19092
    ports:
      # Loopback-only: PLAINTEXT Kafka with no auth, so host tools can reach
      # it but other machines on the network cannot.
      - "127.0.0.1:19092:19092"   # Kafka API for host tools; in-compose clients use redpanda:9092
    volumes:
      - quantlab-kafka:/var/lib/redpanda/data
    healthcheck:
      # rpk exits non-zero while the broker is still coming up.
      test: ["CMD-SHELL", "rpk cluster health | grep -qE 'Healthy: +true'"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      # The dev stage carries the test suite and its extras so `make test`
      # can run pytest in this image. CI builds this target too; prod builds
      # the Dockerfile's default stage, which is the hardened runtime (no dev
      # deps, non-root).
      target: dev
    command: ["uvicorn", "quantlab.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      # With both URLs set the API serves real ingested history. Unset them
      # (or run the `demo` profile) to fall back to the synthetic SQLite
      # dataset, which needs no network and no databases.
      QUANTLAB_DB_URL: ${QUANTLAB_DB_URL:-postgresql://quantlab:quantlab@postgres:5432/quantlab}
      QUANTLAB_CH_URL: ${QUANTLAB_CH_URL:-clickhouse://quantlab:quantlab@clickhouse:8123/quantlab}
      QUANTLAB_DB: /data/quantlab.db
      QUANTLAB_DB_PATH: /data/quantlab.db
      # Set unconditionally so the backend service definition works with and
      # without the `streaming` profile: the live-replay endpoint answers a
      # clean 503 when the broker is absent, never a startup failure.
      QUANTLAB_KAFKA_BROKERS: redpanda:9092
      QUANTLAB_KAFKA_TOPIC: quantlab.bars
    volumes:
      - quantlab-data:/data
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=5)",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  frontend:
    build: ./frontend
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  quantlab-chdata:   # ClickHouse bars
  quantlab-pgdata:   # Postgres catalog
  quantlab-cache:    # provider HTTP cache + Parquet exports
  quantlab-data:     # synthetic demo SQLite
  quantlab-kafka:    # redpanda log segments (streaming profile)
