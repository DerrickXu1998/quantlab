services:
  # ---------------------------------------------------------------------------
  # Bars. Append-only, columnar, intraday-ready. Holds price_bars and nothing
  # else -- identity and provenance live in Postgres, which has the constraints.
  # ---------------------------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    environment:
      CLICKHOUSE_USER: quantlab
      CLICKHOUSE_PASSWORD: quantlab
      CLICKHOUSE_DB: quantlab
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - quantlab-chdata:/var/lib/clickhouse
    ports:
      # Loopback-only: credentials are local-development defaults, so the
      # databases must not be reachable from other hosts on the network.
      - "127.0.0.1:8123:8123"   # HTTP, what clickhouse-connect uses
      - "127.0.0.1:9000:9000"   # native protocol, for clickhouse-client
    ulimits:
      # ClickHouse opens a lot of files; the Docker default is too low and it
      # degrades quietly rather than failing loudly.
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      # 127.0.0.1, not localhost: inside the container localhost resolves to
      # ::1 and the server listens on IPv4, so the probe would never connect.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Catalog. Instruments, vendor symbol maps, universe snapshots, ingest
  # provenance, corporate actions. Small, relational, constraint-enforced.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: quantlab
      POSTGRES_PASSWORD: quantlab
      POSTGRES_DB: quantlab
      # Deterministic collation: index order must not depend on the host locale.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - quantlab-pgdata:/var/lib/postgresql/data
    ports:
      # Exposed so a notebook or psql on the host can reach the same database
      # the stack uses. Credentials are local-development only, so the
      # binding is loopback-only to keep them off the network.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantlab -d quantlab"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Schema owner. Runs on every `up`, exits when the database matches the
  # migrations on disk; the backend waits for it. Data loading is not here:
  # it lives in quantlab-data-pipeline, which loads into this same stack.
  # ---------------------------------------------------------------------------
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    image: quantlab-migrate:latest
    command: ["migrate"]
    environment:
      QUANTLAB_DB_URL: ${QUANTLAB_DB_URL:-postgresql://quantlab:quantlab@postgres:5432/quantlab}
      QUANTLAB_CH_URL: ${QUANTLAB_CH_URL:-clickhouse://quantlab:quantlab@clickhouse:8123/quantlab}
      # Empty by default: the local URLs above carry their own passwords. Set
      # them (with the two URLs) to point this stack at the managed services.
      PGPASSWORD: ${PGPASSWORD:-}
      QUANTLAB_CH_PASSWORD: ${QUANTLAB_CH_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    restart: "no"

  # ---------------------------------------------------------------------------
  # Synthetic demo seed (SQLite). Kept so `make up` still produces a working
  # UI with no network access; the real data path is postgres + clickhouse,
  # loaded by quantlab-data-pipeline.
  # ---------------------------------------------------------------------------
  seed:
    build:
      context: ./backend
      target: dev   # shares the backend service's image layers; see above
    command: ["python", "-m", "quantlab.seed"]
    profiles: ["demo"]
    environment:
      QUANTLAB_DB: /data/quantlab.db
      QUANTLAB_DB_PATH: /data/quantlab.db
    volumes:
      - quantlab-data:/data
    restart: "no"

  # ---------------------------------------------------------------------------
  # Event bus. Kafka API, single binary, no JVM; ~50 MB idle. Part of the
  # stack because live IBKR prices travel on it (quantlab.live.ticks);
  # `QUANTLAB_LIVE=off make up` leaves it out. It also carries streamed
  # replays: the publisher (quantlab-data-pipeline:
  # `make quantlab-data ARGS="replay-publish ..."`) turns warehouse history
  # into a chronological bar stream the backend serves at
  # GET /api/v1/replay/live/stream.
  # ---------------------------------------------------------------------------
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.18
    command:
      - redpanda
      - start
      - --mode
      - dev-container
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --overprovisioned
      - --node-id
      - "0"
      - --check=false
      # Two listeners on one broker: compose-network traffic talks to
      # redpanda:9092, host traffic to localhost:19092. The advertised address
      # is what clients reconnect to after bootstrap, so both must be listed.
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092,OUTSIDE://localhost:19092
    ports:
      # Loopback-only: PLAINTEXT Kafka with no auth, so host tools can reach
      # it but other machines on the network cannot.
      - "127.0.0.1:19092:19092"   # Kafka API for host tools; in-compose clients use redpanda:9092
    volumes:
      - quantlab-kafka:/var/lib/redpanda/data
    healthcheck:
      # rpk exits non-zero while the broker is still coming up.
      test: ["CMD-SHELL", "rpk cluster health | grep -qE 'Healthy: +true'"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      # The dev stage carries the test suite and its extras so `make test`
      # can run pytest in this image. CI builds this target too; prod builds
      # the Dockerfile's default stage, which is the hardened runtime (no dev
      # deps, non-root).
      target: dev
    command: ["uvicorn", "quantlab.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      # With both URLs set the API serves real ingested history. Unset them
      # (or run the `demo` profile) to fall back to the synthetic SQLite
      # dataset, which needs no network and no databases.
      QUANTLAB_DB_URL: ${QUANTLAB_DB_URL:-postgresql://quantlab:quantlab@postgres:5432/quantlab}
      QUANTLAB_CH_URL: ${QUANTLAB_CH_URL:-clickhouse://quantlab:quantlab@clickhouse:8123/quantlab}
      # Empty by default: the local URLs above carry their own passwords. Set
      # them (with the two URLs) to point this stack at the managed services.
      PGPASSWORD: ${PGPASSWORD:-}
      QUANTLAB_CH_PASSWORD: ${QUANTLAB_CH_PASSWORD:-}
      QUANTLAB_DB: /data/quantlab.db
      QUANTLAB_DB_PATH: /data/quantlab.db
      # Set unconditionally so the backend works with and without the bus
      # (QUANTLAB_LIVE=off): the streaming endpoints answer a clean 503 when
      # the broker is absent, never a startup failure.
      QUANTLAB_KAFKA_BROKERS: redpanda:9092
      QUANTLAB_KAFKA_TOPIC: quantlab.bars
      # Live IBKR prices (roadmap 4a), published by live-ingest or, in
      # development, scripts/live_fake_publish.py. Same 503-not-crash rule.
      QUANTLAB_LIVE_TICKS_TOPIC: quantlab.live.ticks
      # Each user's own IBKR connection goes through the live manager.
      QUANTLAB_LIVE_MANAGER_URL: http://live-manager:8790
      QUANTLAB_LIVE_MANAGER_TOKEN: ${QUANTLAB_LIVE_MANAGER_TOKEN:-}
      # Login is on unless the host says otherwise; `AUTH_BYPASS=1 make dev`
      # sets this to false for local UI work.
      QUANTLAB_AUTH_REQUIRED: ${QUANTLAB_AUTH_REQUIRED:-true}
    volumes:
      - quantlab-data:/data
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=5)",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Live market data (roadmap 4a). Starts with the stack (`make up`/`make dev`);
  # `QUANTLAB_LIVE=off make up` leaves it out. Idle it costs ~0.15 GB (redpanda
  # ~50 MB, this manager ~80 MB, measured). A user's gateway (~0.2 GB before
  # login, measured; more once streaming) starts on their "Save & connect" and
  # stays on until they disconnect -- restarted if it stops -- unless
  # QUANTLAB_LIVE_IDLE_MINUTES is set.
  #
  # No shared IBKR login: one account's market data is licensed to that
  # account's holder, so each user connects their own account from the Market
  # tab. The manager starts one IB Gateway container per connected user
  # (logged in as them, READ_ONLY_API: no orders can go through it), runs a
  # collector for each, queues users beyond QUANTLAB_LIVE_MAX_GATEWAYS (each
  # gateway is a ~1 GB JVM) and stops idle ones. Passwords are passed to the
  # user's gateway only -- quantlab stores none.
  #
  # The manager holds the Docker socket (so it can start those containers) and
  # is therefore the most privileged service here: nothing is published, the
  # backend reaches it with QUANTLAB_LIVE_MANAGER_TOKEN, and the gateways sit
  # on their own network that reaches the manager but no database.
  # ---------------------------------------------------------------------------
  live-manager:
    build: ./live-ingest
    # Root inside the container to use the mounted Docker socket.
    user: "0"
    environment:
      QUANTLAB_DB_URL: ${QUANTLAB_DB_URL:-postgresql://quantlab:quantlab@postgres:5432/quantlab}
      QUANTLAB_CH_URL: ${QUANTLAB_CH_URL:-clickhouse://quantlab:quantlab@clickhouse:8123/quantlab}
      QUANTLAB_CH_PASSWORD: ${QUANTLAB_CH_PASSWORD:-}
      QUANTLAB_KAFKA_BROKERS: redpanda:9092
      QUANTLAB_LIVE_TICKS_TOPIC: quantlab.live.ticks
      QUANTLAB_LIVE_MANAGER_TOKEN: ${QUANTLAB_LIVE_MANAGER_TOKEN:-}
      QUANTLAB_LIVE_NETWORK: quantlab-live
      QUANTLAB_LIVE_MAX_GATEWAYS: ${QUANTLAB_LIVE_MAX_GATEWAYS:-2}
      # 0 (default): a connected gateway stays on until its user disconnects.
      QUANTLAB_LIVE_IDLE_MINUTES: ${QUANTLAB_LIVE_IDLE_MINUTES:-0}
      QUANTLAB_LIVE_MAX_LINES: ${QUANTLAB_LIVE_MAX_LINES:-90}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - default
      - live
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  quantlab-chdata:   # ClickHouse bars
  quantlab-pgdata:   # Postgres catalog
  quantlab-data:     # synthetic demo SQLite
  quantlab-kafka:    # redpanda log segments (streaming profile)

networks:
  # Per-user IB Gateways join this, and only this: the manager's collectors
  # reach them, and they reach nothing else in the stack.
  live:
    name: quantlab-live
