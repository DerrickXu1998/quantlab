[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantlab"
version = "0.1.0"
description = "QuantLab signal viewer demo backend: synthetic data, signal plugins, FastAPI API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "uvicorn>=0.30",
    "numpy>=1.26",
    # Read access to the warehouse: Postgres catalog + ClickHouse bars. The
    # API reads both; it never carries the provider stack (that is the ingest
    # image's job) and so has no pandas, requests or yfinance.
    "psycopg[binary]>=3.1",
    "clickhouse-connect>=0.7",
    # Live replay over the event bus (quantlab.streaming). Pure python, no
    # native libs; imported lazily so the API still boots when the broker is
    # absent -- the live endpoint answers 503 instead.
    "kafka-python>=2.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.format]
quote-style = "double"
