openapi: 3.1.0
info:
  title: QuantLab Signal Viewer API
  version: 0.6.0
  description: >
    Typed API boundary for the QuantLab demo. This document is the authored
    single source of truth (Constitution V): the FastAPI app is validated
    against it by a contract test, and the TypeScript client is generated from
    it with openapi-typescript. All computation happens in the backend.

    Supersedes specs/005-signal-research-workbench/contracts/openapi.yaml as
    the authored home, carrying every existing path forward and adding dataset
    provenance for feature 006-warehouse-experiments. The same paths serve
    either the synthetic demo dataset or real ingested history; handlers do not
    branch on which, and every run records which one produced it. Running a
    model remains the one state-changing operation, and it writes only to
    experiment storage -- never to a curated or materialised signal set.

    Version 0.6.0 adds identity, strategies and execution criteria. Three
    things that were previously impossible become expressible: a caller owns
    their own runs rather than sharing one global table; a strategy is several
    signals combined rather than a single rule; and the rules that turn a
    signal into a trade -- sizing, fill timing, costs, stops -- are request
    fields rather than hardcoded behaviour disclosed in prose. Nothing is
    removed or renamed: a request that was valid at 0.5.0 is valid here and
    produces the same answer, which is what makes stored runs reproducible.
servers:
  - url: /api/v1
tags:
  - name: system
  - name: instruments
  - name: signals
  - name: models
  - name: runs
  - name: replay
  - name: auth
  - name: strategies

paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Service health, including seed status
      responses:
        "200":
          description: Backend is up and the seeded database is reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /instruments:
    get:
      tags: [instruments]
      operationId: listInstruments
      summary: List the synthetic instrument universe
      responses:
        "200":
          description: All seeded instruments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstrumentList"

  /instruments/{symbol}/prices:
    get:
      tags: [instruments]
      operationId: getPrices
      summary: Daily OHLCV history for one instrument
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-Z0-9][A-Z0-9._-]{0,19}$"
        - name: start_date
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Bars ordered ascending by date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceBarList"
        "404":
          description: Unknown symbol
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /signals:
    get:
      tags: [signals]
      operationId: listSignals
      summary: List signals with filtering, sorting, and total count
      description: >
        `total` always reflects the full result set under the active filters,
        independent of pagination, so the UI count can be checked against the
        backend (SC-004).
      parameters:
        - name: instrument
          in: query
          required: false
          schema:
            type: string
            pattern: "^[A-Z0-9][A-Z0-9._-]{0,19}$"
        - name: signal_type
          in: query
          required: false
          description: Signal rule name, e.g. sma-crossover
          schema:
            type: string
        - name: direction
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Direction"
        - name: start_date
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [date_asc, date_desc]
            default: date_desc
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Filtered signals with total count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalList"
        "400":
          description: Invalid filter combination (e.g. start_date after end_date)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /models:
    get:
      tags: [models]
      operationId: listModels
      summary: Catalog of registered signal models, discovered at runtime
      description: >
        Enumerates every model currently registered in the backend plugin
        registry, with its declared parameter metadata (Constitution II).
        Registering a model MUST make it appear here with no change to this
        document's consumers.
      responses:
        "200":
          description: Registered models
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelList"

  /runs:
    post:
      tags: [runs]
      operationId: createRun
      summary: Run a model over a dataset selection
      description: >
        Validates the requested parameters against the model's declared
        metadata, resolves a warm-up window of the model's lookback_days before
        start_date, executes, and returns the completed run. Signals dated
        outside [start_date, end_date] are computed for warm-up but not
        reported. Execution is synchronous; see research.md for the scaling
        boundary this implies.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunRequest"
      responses:
        "201":
          description: Run completed (a run producing zero signals is a success)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "404":
          description: Unknown model, or an unknown symbol in the selection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: >
            Parameter outside its declared range, window shorter than the
            model's lookback, start_date after end_date, or a selection larger
            than the permitted bound. The offending field is named.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      tags: [runs]
      operationId: listRuns
      summary: List recorded runs, newest first
      parameters:
        - name: saved_only
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: When true, return only runs saved with a name.
      responses:
        "200":
          description: Recorded runs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunList"

  /runs/{run_id}:
    parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [runs]
      operationId: getRun
      summary: One run with its provenance, summary, and produced signals
      responses:
        "200":
          description: The run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunDetail"
        "404":
          description: Unknown run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      tags: [runs]
      operationId: saveRun
      summary: Name a run to keep it as a saved experiment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
      responses:
        "200":
          description: Updated run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "404":
          description: Unknown run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [runs]
      operationId: deleteRun
      summary: Delete a run and the signals it produced
      responses:
        "204":
          description: Deleted
        "404":
          description: Unknown run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /runs/{run_id}/performance:
    parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [runs]
      operationId: getRunPerformance
      summary: Equity curve, benchmark, trades and risk metrics for one run
      description: >
        Derived from the run's own signals and the bars inside its window, and
        computed here because the frontend must not embed analytical
        computation (Constitution V). Recomputed on request rather than stored:
        every input is already persisted, so a cached copy could only go stale.

        Not a tradeable backtest. `assumptions` lists every simplification
        applied and ships inside the payload, so the caveat travels with the
        numbers rather than living in UI copy that a refactor can drop.
      responses:
        "200":
          description: Performance of the run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunPerformance"
        "404":
          description: Unknown run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >
            The run failed, so it has no performance. Zeroed figures would read
            as a flat book rather than as an absent result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /runs/{run_id}/replay/stream:
    parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [replay]
      operationId: streamRunReplay
      summary: Replay a run's window as a server-sent event stream
      description: >
        Streams the run's window chronologically, as if history were arriving
        live: each trading date's bars, the stored signals firing that date,
        the fills the simulator executes at that date's close, and one
        end-of-date equity mark, ending with a summary event. The body is a
        sequence of `data: {json}\n\n` frames; every frame's JSON object
        carries an `event` field, one of:

          * `bar` -- `{date, closes}`: the date's close per run symbol. Thinned
            to every `step`-th date; a date carrying a signal always gets one.
          * `signal` -- `{date, symbol, direction, trigger_values,
            data_window_end}`: a stored signal as it fires.
          * `fill` -- `{date, symbol, side, qty, price, value,
            realized_pnl}`: an executed trade at the close of the signal date.
          * `equity` -- `{date, equity, cash, positions, realized_pnl}`: the
            book marked once per replayed date, after that date's fills.
          * `summary` -- terminal; the ReplaySummary object.
          * `truncated` -- terminal in place of `summary` when `max_events`
            cut the stream short: `{event, detail}`.

        Events on one date arrive in bar, signal, fill, equity order, so a
        signal never precedes the bar event of its own date. Sizing and
        filling mirror the run's performance report exactly (equal-weight
        per-symbol sleeves, close-of-signal-date fills, no costs): the
        terminal `summary` reconciles with GET /runs/{run_id}/performance.
      parameters:
        - name: interval_ms
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 10000
            default: 0
          description: >
            Optional server-side pacing: milliseconds to wait between dates
            (after each equity event). 0 streams as fast as possible; the
            data is historical, so clients may pace themselves instead.
        - name: max_events
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 5000000
            default: 250000
          description: >
            Safety cap on frames emitted. On reaching it the stream ends with
            a `truncated` frame instead of `summary`.
        - name: step
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Emit bar events only every Nth date; 1 is every date.
      responses:
        "200":
          description: Server-sent event stream of replay events
          content:
            text/event-stream:
              schema:
                type: string
                description: "One `data: {json}\\n\\n` frame per replay event."
        "404":
          description: Unknown run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The run failed, so there is nothing to replay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /runs/{run_id}/replay/summary:
    parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [replay]
      operationId: getRunReplaySummary
      summary: The replay engine run to completion, as one object
      description: >
        Drives the same engine as the stream endpoint to completion and
        returns only its terminal summary event. Useful for clients that do
        not want SSE, and the cheapest way to check a replay reconciles with
        GET /runs/{run_id}/performance.
      responses:
        "200":
          description: Replay summary for the run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplaySummary"
        "404":
          description: Unknown run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The run failed, so there is nothing to replay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /replay/live/stream:
    get:
      tags: [replay]
      operationId: streamLiveReplay
      summary: Replay a Kafka bar stream live, as a server-sent event stream
      description: >
        The streaming counterpart of GET /runs/{run_id}/replay/stream. A
        publisher (`quantlab replay-publish`) has turned a warehouse window
        into a chronological bar stream on the Kafka replay topic; this
        endpoint consumes the topic from the beginning, re-runs the model's
        compute on each symbol's growing window as bars arrive (identical to
        batch by the point-in-time truncation guarantee), and trades the new
        signals through the same portfolio simulator.

        The frame format is exactly the batch replay's: `bar`, `signal`,
        `fill`, `equity` and a terminal `summary` (whose `run_id` is
        `live:<model>`), plus `truncated` if `max_events` cuts the stream
        short. Bars dated before `start` act as warm-up: they feed the
        model's lookback but emit no events and no trades, mirroring how a
        batch run loads history before its window. Because of that warm-up,
        the terminal summary reconciles with a batch replay of a run over the
        same model, symbols and window when the publisher's range covers the
        model's lookback before `start`.

        Requires the streaming stack (`docker compose --profile streaming
        up`). A 503 means the bus is unconfigured (QUANTLAB_KAFKA_BROKERS
        unset) or the broker is unreachable -- never a startup failure.
      parameters:
        - name: model
          in: query
          required: false
          schema:
            type: string
            default: sma-crossover
          description: Signal rule name; the latest registered version is used.
        - name: symbols
          in: query
          required: true
          schema:
            type: string
          description: Comma-separated canonical symbols, e.g. `ZX1.US,ZX2.US`.
        - name: start
          in: query
          required: true
          schema:
            type: string
            format: date
          description: First session date of the replayed window.
        - name: end
          in: query
          required: true
          schema:
            type: string
            format: date
          description: Last session date of the replayed window.
        - name: params
          in: query
          required: false
          schema:
            type: string
          description: >
            Model parameter overrides as a JSON object, e.g.
            `{"fast": 10, "slow": 30}`.
        - name: initial_cash
          in: query
          required: false
          schema:
            type: number
            exclusiveMinimum: 0
            default: 100000
          description: Starting book value, split into equal per-symbol sleeves.
        - name: max_events
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 5000000
            default: 250000
          description: >
            Safety cap on frames emitted. On reaching it the stream ends with
            a `truncated` frame instead of `summary`.
      responses:
        "200":
          description: Server-sent event stream of replay events
          content:
            text/event-stream:
              schema:
                type: string
                description: "One `data: {json}\\n\\n` frame per replay event."
        "400":
          description: Missing or malformed symbols, start, end or params
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: A parameter override failed the model's declared spec
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: The event bus is unconfigured or unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Create an account and return a session
      description: >
        A 409 does disclose that an address is registered. That is unavoidable
        for a self-service signup -- refusing to say so would mean silently not
        creating the account -- and it is why the *login* path, not this one, is
        hardened against enumeration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "201":
          description: The new account and its first session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "409":
          description: That email address is already registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: The password does not meet the policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Exchange credentials for a session
      description: >
        An unknown address and a wrong password produce the same status, the
        same body and the same timing -- the unknown-address path still performs
        a full key derivation against a dummy hash. Skipping that work would
        make "does this person have an account?" answerable with a stopwatch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "200":
          description: A new session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          description: Invalid email or password -- deliberately says no more
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Too many failed attempts against this address
          headers:
            Retry-After:
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke the calling session
      security: [{ bearerAuth: [] }]
      description: >
        Revokes this session and no other. Possible only because a session is a
        row rather than a signed token: a stateless token cannot be withdrawn
        before it expires, which would make this endpoint a gesture.
      responses:
        "204":
          description: Revoked
        "401":
          description: Not authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/me:
    get:
      tags: [auth]
      operationId: getCurrentUser
      summary: The authenticated user
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /strategies:
    get:
      tags: [strategies]
      operationId: listStrategies
      summary: The caller's saved strategies
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Strategies belonging to the caller, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrategyList"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      tags: [strategies]
      operationId: createStrategy
      summary: Save a strategy
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StrategyRequest"
      responses:
        "201":
          description: The saved strategy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Strategy"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: >
            The spec cannot be executed. The detail names the offending
            component index and field, e.g.
            `components[0].parameters.period: must be <= 100`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /strategies/{strategy_id}:
    parameters:
      - name: strategy_id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [strategies]
      operationId: getStrategy
      summary: One strategy
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The strategy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Strategy"
        "404":
          description: >
            Unknown, or not the caller's. Another user's strategy reads as
            absent rather than forbidden: a 403 would confirm that the row
            exists, which the caller has not earned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    put:
      tags: [strategies]
      operationId: replaceStrategy
      summary: Replace a strategy
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StrategyRequest"
      responses:
        "200":
          description: The updated strategy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Strategy"
        "404":
          description: Unknown, or not the caller's
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: The spec cannot be executed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [strategies]
      operationId: deleteStrategy
      summary: Delete a strategy
      security: [{ bearerAuth: [] }]
      responses:
        "204":
          description: Deleted
        "404":
          description: Unknown, or not the caller's
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /strategy-templates:
    get:
      tags: [strategies]
      operationId: listStrategyTemplates
      summary: Complete starter strategies
      description: >
        Unauthenticated: they are identical for everyone and contain nothing of
        anybody's. Assembled from the registry at request time, so a template
        can only ever name rules that actually exist. Each carries realistic
        costs -- a starter that charged nothing would teach a new user that
        turnover is free, which is the most expensive lesson to unlearn.
      responses:
        "200":
          description: The template catalogue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrategyTemplateList"


components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        An opaque session token, not a JWT. The session is a row, so logout
        genuinely revokes it and only its SHA-256 is stored -- reading the
        database yields no usable credential. Required on every path except
        `/health`, `/models`, `/strategy-templates` and the two `/auth` entry
        points, unless the deployment sets `QUANTLAB_AUTH_REQUIRED=false`, in
        which case every request is bound to a built-in local account.

  schemas:
    Dataset:
      type: string
      enum: [sqlite, warehouse]
      description: >
        Which store answered. `sqlite` is the synthetic demo dataset;
        `warehouse` is real ingested history. Two runs from different datasets
        are never directly comparable.

    CorporateActionNotice:
      type: object
      additionalProperties: false
      required: [instrument_id, symbol, ex_date, action_type]
      description: >
        A split or dividend inside a run's window. Reported, never applied:
        stored bars are unadjusted, so a split makes the price series jump in a
        way that is an artefact rather than a market move.
      properties:
        instrument_id:
          type: integer
        symbol:
          type: string
        ex_date:
          type: string
          format: date
        action_type:
          type: string
          enum: [split, dividend]
        split_ratio:
          type: number
          nullable: true
        dividend:
          type: number
          nullable: true

    Health:
      type: object
      required: [status, dataset, seeded, signal_count]
      properties:
        status:
          type: string
          enum: [ok]
        dataset:
          $ref: "#/components/schemas/Dataset"
        seeded:
          type: boolean
          description: True once the seed step has completed
        signal_count:
          type: integer
          minimum: 0
        auth_required:
          type: boolean
          default: true
          description: >
            Whether this deployment demands a bearer token. Carried on the one
            endpoint that never needs one, because a client has to learn this
            before it can possibly hold a token.

    Direction:
      type: string
      enum: [bullish, bearish]

    Instrument:
      type: object
      required: [symbol, name, currency, regime_profile]
      properties:
        symbol:
          type: string
          example: ZZTRND
        name:
          type: string
          example: Zeno Trend Industries (synthetic)
        currency:
          type: string
          example: USD
        regime_profile:
          type: string
          enum: [trending, mean_reverting, volatile, mixed]

    InstrumentList:
      type: object
      required: [total, items]
      properties:
        total:
          type: integer
          minimum: 0
        items:
          type: array
          items:
            $ref: "#/components/schemas/Instrument"

    PriceBar:
      type: object
      required: [symbol, date, open, high, low, close, volume]
      properties:
        symbol:
          type: string
        date:
          type: string
          format: date
        open:
          type: number
        high:
          type: number
        low:
          type: number
        close:
          type: number
        volume:
          type: integer
          minimum: 0

    PriceBarList:
      type: object
      required: [total, items]
      properties:
        total:
          type: integer
          minimum: 0
        items:
          type: array
          items:
            $ref: "#/components/schemas/PriceBar"

    Signal:
      type: object
      required:
        - id
        - symbol
        - date
        - rule_name
        - rule_version
        - parameters
        - direction
        - trigger_values
        - data_window_end
      properties:
        id:
          type: integer
        symbol:
          type: string
        date:
          type: string
          format: date
          description: Signal date T; only data knowable by T was used
        rule_name:
          type: string
          example: sma-crossover
        rule_version:
          type: string
          example: 1.0.0
        parameters:
          type: object
          additionalProperties: true
          example: { fast: 20, slow: 50 }
        direction:
          $ref: "#/components/schemas/Direction"
        trigger_values:
          type: object
          additionalProperties: true
          description: Indicator values that fired the rule
          example: { sma_fast: 101.2, sma_slow: 99.8 }
        data_window_end:
          type: string
          format: date
          description: Latest bar date used as input; always <= date (Constitution VII)

    SignalList:
      type: object
      required: [total, items]
      properties:
        total:
          type: integer
          minimum: 0
          description: Total signals matching the active filters (pre-pagination)
        items:
          type: array
          items:
            $ref: "#/components/schemas/Signal"

    Error:
      type: object
      required: [detail]
      properties:
        detail:
          type: string

    ParamSpec:
      type: object
      additionalProperties: false
      required: [name, type, default]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [int, float, bool, enum]
        default: {}
        minimum:
          type: number
          nullable: true
          description: Inclusive lower bound; numeric types only.
        maximum:
          type: number
          nullable: true
          description: Inclusive upper bound; numeric types only.
        choices:
          type: array
          nullable: true
          items: {}
          description: Permitted values; required when type is enum.
        description:
          type: string

    Model:
      type: object
      additionalProperties: false
      required: [name, version, parameters, lookback_days, scale_class, direction_semantics]
      properties:
        name:
          type: string
          example: sma-crossover
        version:
          type: string
          example: 1.0.0
        parameters:
          type: array
          items:
            $ref: "#/components/schemas/ParamSpec"
        lookback_days:
          type: integer
          minimum: 1
          description: Bars of history the model needs before it can emit.
        scale_class:
          type: string
          enum: [scale_free, price_scaled]
        direction_semantics:
          type: string
        category:
          type: string
          enum: [trend, momentum, mean_reversion, volatility, volume]
          default: trend
          description: Presentation metadata; nothing in the engine branches on it.
        summary:
          type: string
          description: One line, for a catalogue card.
        roles:
          type: array
          default: [entry, exit]
          items:
            type: string
            enum: [entry, exit, filter]
          description: >
            Which slots in a strategy this rule may fill. A rule that reports a
            *regime* rather than a tradeable event -- ADX above a threshold --
            advertises `[filter]` only, and a strategy naming it as an entry is
            refused. Without this a user can build a strategy that enters on
            every bar with no way to see why.

    ModelList:
      type: object
      additionalProperties: false
      required: [total, items]
      properties:
        total:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/Model"

    RunRequest:
      type: object
      additionalProperties: false
      required: [symbols, start_date, end_date]
      description: >
        Exactly one of `model_name`, `strategy_id` or `strategy` identifies what
        to run; giving two is a 400, because silently preferring one would run
        something other than what the caller wrote. The single-model form is
        unchanged and still supported -- it is promoted internally into a
        one-rule strategy, so there is one execution path rather than a legacy
        branch that slowly stops matching the real one.
      properties:
        model_name:
          type: string
        model_version:
          type: string
          description: Omit to use the highest registered version.
        parameters:
          type: object
          additionalProperties: true
          description: >
            Overrides only. Omitted parameters take the model's declared
            default; the merged result is recorded as the run's effective
            parameters.
        symbols:
          type: array
          minItems: 1
          items:
            type: string
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        strategy_id:
          type: string
          description: A saved strategy of the caller's.
        strategy:
          $ref: "#/components/schemas/StrategyRequest"
        execution:
          $ref: "#/components/schemas/ExecutionConfig"

    RunCoverage:
      type: object
      additionalProperties: false
      required: [instruments_requested, instruments_with_data, instruments_full_warmup]
      properties:
        instruments_requested:
          type: integer
          minimum: 1
        instruments_with_data:
          type: integer
          minimum: 0
          description: How many requested instruments had bars in the window.
        instruments_full_warmup:
          type: integer
          minimum: 0
          description: >
            How many had the model's full lookback before start_date. The
            remainder may under-report early in the window.

    Run:
      type: object
      additionalProperties: false
      required:
        - id
        - model_name
        - model_version
        - parameters
        - symbols
        - start_date
        - end_date
        - status
        - created_at
        - signal_count
        - coverage
        - dataset
      properties:
        id:
          type: string
        name:
          type: string
          nullable: true
          description: Set when saved as a named experiment; null otherwise.
        model_name:
          type: string
        model_version:
          type: string
        parameters:
          type: object
          additionalProperties: true
          description: Effective parameters (declared defaults merged with overrides).
        symbols:
          type: array
          items:
            type: string
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        status:
          type: string
          enum: [completed, failed]
        error:
          type: string
          nullable: true
          description: Present when status is failed.
        created_at:
          type: string
          format: date-time
        signal_count:
          type: integer
          minimum: 0
          description: Zero is a valid result, not a failure.
        coverage:
          $ref: "#/components/schemas/RunCoverage"
        dataset:
          $ref: "#/components/schemas/Dataset"
        instrument_ids:
          type: array
          nullable: true
          items:
            type: integer
          description: >
            Surrogate instrument identities actually run against. Present for
            warehouse runs, null on the demo. Recorded because the canonical
            symbol is unique but editable, while instrument_id is the stable
            key the bar store joins on.
        ingest_run_ids:
          type: array
          nullable: true
          items:
            type: integer
          description: >
            The ingest runs behind the bars this run read. This is what makes a
            later re-ingest of the same window distinguishable from the
            original run, when every input the researcher chose is identical.
        corporate_actions:
          type: array
          items:
            $ref: "#/components/schemas/CorporateActionNotice"
          description: >
            Actions overlapping the window for the selected instruments. Empty
            on the demo dataset, which has none.
        re_runnable:
          type: boolean
          description: >
            False when the run's recorded dataset is not the active one. The
            run stays readable; it simply cannot be reproduced as recorded.
        strategy:
          oneOf:
            - $ref: "#/components/schemas/StrategyRequest"
            - type: "null"
          description: >
            The fully resolved strategy that actually ran. Null on runs recorded
            before strategies existed; the API reports that rather than
            inventing a spec those runs never had.
        execution:
          oneOf:
            - $ref: "#/components/schemas/ExecutionConfig"
            - type: "null"
          description: The fully resolved execution criteria that actually ran.
        execution_summary:
          oneOf:
            - $ref: "#/components/schemas/ExecutionSummary"
            - type: "null"
        model_available:
          type: boolean
          description: >
            False when the recorded model/version is no longer registered; the
            run stays readable but is not re-runnable.

    RunList:
      type: object
      additionalProperties: false
      required: [total, items]
      properties:
        total:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/Run"

    ExperimentSignal:
      type: object
      additionalProperties: false
      required: [symbol, date, direction, trigger_values, data_window_end]
      properties:
        symbol:
          type: string
        date:
          type: string
          format: date
        direction:
          $ref: "#/components/schemas/Direction"
        trigger_values:
          type: object
          additionalProperties: true
        data_window_end:
          type: string
          format: date
          description: >
            Latest bar date used as input; always <= date (point-in-time proof,
            Constitution VII).
        kind:
          type: string
          enum: [entry, exit, both]
          default: both
          description: >
            Whether this opens a position, closes one, or does both. `both` is
            one rule wearing both hats, which is exactly what a single-model run
            is -- and what rows recorded before strategies existed mean. Emitted
            as one decision rather than two so a legacy run records exactly the
            signals it always did.

    RunDetail:
      allOf:
        - $ref: "#/components/schemas/Run"
        - type: object
          required: [signals]
          properties:
            signals:
              type: array
              items:
                $ref: "#/components/schemas/ExperimentSignal"

    EquityPoint:
      type: object
      additionalProperties: false
      required: [date, value]
      properties:
        date:
          type: string
          format: date
        value:
          type: number
          description: Book value on that date, in units of initial_capital.

    Trade:
      type: object
      additionalProperties: false
      required:
        - symbol
        - entry_date
        - entry_price
        - exit_date
        - exit_price
        - return_pct
        - open
      properties:
        symbol:
          type: string
        entry_date:
          type: string
          format: date
        entry_price:
          type: number
        exit_date:
          type: string
          format: date
          nullable: true
          description: Null while the position is still open at the end of the window.
        exit_price:
          type: number
          description: >
            Realised exit for a closed trade; the last close for an open one.
        return_pct:
          type: number
        open:
          type: boolean
          description: >
            True when the position was still held at the end of the window. An
            open trade is marked to market, not realised, and never counts
            toward the win rate.
        side:
          type: string
          enum: [long, short]
          default: long
        qty:
          type: number
          default: 0
        exit_reason:
          allOf:
            - $ref: "#/components/schemas/ExitReason"
          default: signal
        pnl:
          type: number
          default: 0
          description: Net of this trade's own commission, both sides.
        fees:
          type: number
          default: 0

    PerformanceMetrics:
      type: object
      additionalProperties: false
      required:
        - total_return
        - sharpe_ratio
        - max_drawdown
        - win_rate
        - trade_count
        - winning_trades
        - losing_trades
      properties:
        total_return:
          type: number
          description: Fraction, e.g. 0.12 for +12%.
        sharpe_ratio:
          type: number
          nullable: true
          description: >
            Annualised from daily returns at a zero risk-free rate. Null when
            undefined -- fewer than two points, or zero variance. A fabricated
            0.0 would read as "measured, and mediocre".
        max_drawdown:
          type: number
          description: >
            Negative fraction, e.g. -0.153 for a 15.3% peak-to-trough fall.
            Exactly 0 for a curve that never fell.
        win_rate:
          type: number
          nullable: true
          description: >
            Share of *closed* trades that gained. Null when nothing has closed.
        trade_count:
          type: integer
          minimum: 0
          description: All positions, including any still open.
        winning_trades:
          type: integer
          minimum: 0
        losing_trades:
          type: integer
          minimum: 0

    RunPerformance:
      type: object
      additionalProperties: false
      required:
        - run_id
        - initial_capital
        - equity
        - benchmark
        - metrics
        - trades
        - assumptions
      properties:
        run_id:
          type: string
        initial_capital:
          type: number
          description: >
            Notional book size. Arbitrary but fixed: every ratio reported here
            is scale-invariant, so this only sets the axis labels.
        equity:
          type: array
          items:
            $ref: "#/components/schemas/EquityPoint"
          description: >
            The strategy's book, marked to close on each bar date in the
            window. Empty when the window contained no bars.
        benchmark:
          type: array
          items:
            $ref: "#/components/schemas/EquityPoint"
          description: >
            Equal-weight buy-and-hold of the same selection. Deliberately the
            run's own universe rather than an index, so the comparison isolates
            the model's timing from which names it was pointed at.
        metrics:
          $ref: "#/components/schemas/PerformanceMetrics"
        trades:
          type: array
          items:
            $ref: "#/components/schemas/Trade"
        assumptions:
          type: array
          items:
            type: string
          description: >
            Every simplification applied. These figures are not tradeable and
            must never be presented as if they were.

    # --- Identity -----------------------------------------------------------
        costs:
          $ref: "#/components/schemas/CostBreakdown"
        exit_reasons:
          type: object
          additionalProperties:
            type: integer
          description: >
            Closed-position counts by reason. Sums to the number of trades.

    Credentials:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
          maxLength: 256
          description: >
            At least 12 characters. Hashed with PBKDF2-HMAC-SHA256 at 600,000
            iterations with a 16-byte salt, both recorded in the stored hash so
            the cost can be raised later without a mass password reset. See
            docs/SECURITY.md for why a stdlib KDF rather than argon2.

    User:
      type: object
      additionalProperties: false
      required: [id, email, created_at]
      properties:
        id:
          type: string
        email:
          type: string
        created_at:
          type: string

    Session:
      type: object
      additionalProperties: false
      required: [user, token, expires_at]
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string
          description: >
            Send as `Authorization: Bearer <token>`. 32 bytes of CSPRNG output;
            only its SHA-256 is stored.
        expires_at:
          type: string
          description: Absolute, not sliding -- a stolen token cannot be kept alive by use.

    # --- Strategies ---------------------------------------------------------

    StrategyComponent:
      type: object
      additionalProperties: false
      required: [rule_name]
      description: One signal rule doing one job inside a strategy.
      properties:
        rule_name:
          type: string
        rule_version:
          type: string
          description: Omit to use the highest registered version.
        parameters:
          type: object
          additionalProperties: true
          description: Overrides only; omitted parameters take the rule's default.
        role:
          type: string
          enum: [entry, exit, filter]
          default: entry
          description: >
            **Filters gate, they never fire.** A filter contributes no entry of
            its own and can only prevent one, whichever direction the entry
            points -- "there is a trend here" qualifies a short as much as a
            long. Filters deliberately do *not* gate exits: a filter switching
            off must never trap a position in the book at the exact moment the
            regime has changed.
        weight:
          type: number
          exclusiveMinimum: 0
          default: 1
          description: Read only by `weighted` logic.
        invert:
          type: boolean
          default: false
          description: >
            Swap this component's two directions. How a long-biased filter
            becomes a short-biased one without needing a second rule.

    StrategyRequest:
      type: object
      additionalProperties: false
      required: [name, components]
      properties:
        name:
          type: string
        description:
          type: string
          default: ""
        components:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/StrategyComponent"
        entry_logic:
          type: string
          enum: [all, any, majority, weighted]
          default: all
        exit_logic:
          type: string
          enum: [all, any, majority, weighted]
          default: any
        entry_threshold:
          type: number
          exclusiveMinimum: 0
          default: 1
          description: Net weight needed to fire, under `weighted` logic only.
        exit_threshold:
          type: number
          exclusiveMinimum: 0
          default: 1
        combine_window_days:
          type: integer
          minimum: 1
          default: 1
          description: >
            How many sessions components have to agree within. 1 means "the
            same bar", which is strict enough that two oscillators almost never
            coincide; a window of 3 lets a confirmation arrive a little late.
        execution:
          $ref: "#/components/schemas/ExecutionConfig"

    Strategy:
      allOf:
        - $ref: "#/components/schemas/StrategyRequest"
        - type: object
          required: [id, created_at, updated_at]
          properties:
            id:
              type: string
            owner_id:
              type: [string, "null"]
            created_at:
              type: string
            updated_at:
              type: string
            warnings:
              type: array
              items:
                type: string
              description: >
                Legal but probably not what the user meant -- no exit component,
                a combination that can never occur, filters gating shorts.
                Computed per request rather than stored, because what is worth
                flagging changes as the engine does and a stored copy goes
                stale. Reported, never enforced.

    StrategyList:
      type: object
      additionalProperties: false
      required: [total, items]
      properties:
        total:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/Strategy"

    StrategyTemplate:
      allOf:
        - $ref: "#/components/schemas/StrategyRequest"
        - type: object
          required: [id]
          properties:
            id:
              type: string
              enum:
                - rsi-mean-reversion
                - macd-trend-following
                - donchian-breakout
                - dual-confirmation

    StrategyTemplateList:
      type: object
      additionalProperties: false
      required: [total, items]
      properties:
        total:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/StrategyTemplate"

    # --- Execution ----------------------------------------------------------

    ExecutionConfig:
      type: object
      additionalProperties: false
      description: >
        What turns a signal into a trade. Every field was previously hardcoded
        and merely disclosed in prose.

        Ordering within a bar is fixed, because two criteria can both be
        satisfiable on the same bar and a backtest that resolves them
        arbitrarily is not reproducible: mark, then orders queued yesterday
        fill at today's open, then protective exits (stop, trailing stop,
        target, holding limit, in that order), then signal exits, then entries.

        Gaps resolve pessimistically in both directions, which is not symmetric
        arithmetic. A **stop** the session gapped through fills at the open,
        worse than the level. A **target** the session gapped through fills at
        the target, declining the windfall -- collecting every favourable gap
        adds up to an edge no live book ever earns.
      properties:
        initial_capital:
          type: number
          exclusiveMinimum: 0
          default: 100000
        position_sizing:
          type: string
          enum: [equal_weight, fixed_fraction, fixed_notional, volatility_target]
          default: equal_weight
          description: >
            `equal_weight` gives each instrument its own cash sleeve, which is
            what the pre-execution engine did and what makes a legacy run
            reproduce exactly. The other three draw on one shared pool, so
            `max_positions` and cash rejections behave differently between them.
        sizing_value:
          type: [number, "null"]
          description: >
            Fraction of equity (`fixed_fraction`), cash per trade
            (`fixed_notional`), or target annualised volatility
            (`volatility_target`). Rejected rather than ignored under
            `equal_weight`: silently discarding a number the user typed is how a
            run quietly does something other than what the form said.
        max_positions:
          type: [integer, "null"]
          minimum: 1
        max_position_pct:
          type: number
          exclusiveMinimum: 0
          maximum: 1
          default: 1
        fill_timing:
          type: string
          enum: [signal_close, next_open]
          default: signal_close
        commission_bps:
          type: number
          minimum: 0
          default: 0
          description: Charged per side, on notional.
        slippage_bps:
          type: number
          minimum: 0
          default: 0
          description: Moves the fill price against the trade, per side.
        stop_loss_pct:
          type: [number, "null"]
          exclusiveMinimum: 0
          maximum: 1
          description: >
            A fraction, not a percentage: 0.05 is five percent. Bounded because
            a user who types `5` meaning "five percent" would otherwise get a
            stop 500% away that never triggers, and the backtest would look
            like the stop simply never helped.
        take_profit_pct:
          type: [number, "null"]
          exclusiveMinimum: 0
          maximum: 1
        trailing_stop_pct:
          type: [number, "null"]
          exclusiveMinimum: 0
          maximum: 1
          description: Measured from the best close seen while the position was held.
        atr_stop_multiple:
          type: [number, "null"]
          exclusiveMinimum: 0
          description: >
            Stop at entry -/+ k x ATR as at the entry bar. Set alongside
            `stop_loss_pct`, the tighter of the two binds.
        atr_period:
          type: integer
          minimum: 2
          default: 14
        max_holding_days:
          type: [integer, "null"]
          minimum: 1
        min_holding_days:
          type: integer
          minimum: 0
          default: 0
          description: Suppresses signal exits only; protective exits still fire.
        cooldown_days:
          type: integer
          minimum: 0
          default: 0
        allow_shorts:
          type: boolean
          default: false

    ExecutionSummary:
      type: object
      additionalProperties: false
      description: >
        What the engine did, including what it refused to do. The rejection
        counters matter as much as the fills: a strategy whose signals were
        mostly dropped for want of a free slot has not been tested, and without
        these it looks identical to one that simply signalled rarely.
      properties:
        orders: { type: integer }
        fills: { type: integer }
        rejected_no_cash: { type: integer }
        rejected_max_positions: { type: integer }
        rejected_cooldown: { type: integer }
        rejected_shorts_disabled: { type: integer }
        dropped_no_bar: { type: integer }
        total_commission: { type: number }
        total_slippage: { type: number }
        contradictions:
          type: integer
          description: >
            Dates where the entry logic said both "long" and "short", and so
            said nothing. Neither side was taken.

    CostBreakdown:
      type: object
      additionalProperties: false
      properties:
        commission: { type: number }
        slippage: { type: number }

    ExitReason:
      type: string
      enum: [signal, stop_loss, take_profit, trailing_stop, max_holding, end_of_window]
      description: >
        Why a position closed. "The strategy said so" and "the stop caught it"
        are different facts about a strategy, and averaging them into one win
        rate hides which one is doing the work.

    ReplaySummary:
      type: object
      additionalProperties: false
      required:
        - run_id
        - days
        - initial_cash
        - final_equity
        - total_return
        - sharpe_ratio
        - max_drawdown
        - win_rate
        - trade_count
        - winning_trades
        - losing_trades
        - assumptions
      description: >
        The terminal event of a run's replay. Metrics are computed by the same
        helpers behind GET /runs/{run_id}/performance, over the replayed
        equity curve and trade list, so the two reconcile on the same run.
      properties:
        run_id:
          type: string
        days:
          type: integer
          minimum: 0
          description: Trading dates replayed (dates with at least one bar).
        initial_cash:
          type: number
        final_equity:
          type: number
          description: Book value on the last replayed date.
        total_return:
          type: number
          description: Fraction, e.g. 0.12 for +12%.
        sharpe_ratio:
          type: number
          nullable: true
          description: Null when undefined -- fewer than two points, or zero variance.
        max_drawdown:
          type: number
          description: Negative fraction, peak to trough.
        win_rate:
          type: number
          nullable: true
          description: Share of closed trades that gained. Null when nothing closed.
        trade_count:
          type: integer
          minimum: 0
          description: All positions, including any still open.
        winning_trades:
          type: integer
          minimum: 0
        losing_trades:
          type: integer
          minimum: 0
        assumptions:
          type: array
          items:
            type: string
          description: >
            Every simplification applied, shared with the performance report.
            These figures are not tradeable and must never be presented as if
            they were.
        exit_reasons:
          type: object
          nullable: true
          additionalProperties:
            type: integer
        total_commission:
          type: number
          default: 0
        total_slippage:
          type: number
          default: 0
