openapi: 3.1.0
info:
  title: QuantLab Signal Viewer API
  version: 0.9.0
  description: >
    Typed API boundary for the QuantLab demo. This document is the authored
    single source of truth (Constitution V): the FastAPI app is validated
    against it by a contract test, and the TypeScript client is generated from
    it with openapi-typescript. All computation happens in the backend.

    Supersedes specs/005-signal-research-workbench/contracts/openapi.yaml as
    the authored home, carrying every existing path forward and adding dataset
    provenance for feature 006-warehouse-experiments. The same paths serve
    either the synthetic demo dataset or real ingested history; handlers do not
    branch on which, and every run records which one produced it. Running a
    model remains the one state-changing operation, and it writes only to
    experiment storage -- never to a curated or materialised signal set.

    0.6.0 adds authentication (feature 007). When auth is enabled
    (QUANTLAB_AUTH, default on), every operation except `getHealth`, `login`
    and the bootstrap-gated `registerUser` requires the `quantlab_session`
    cookie issued by `login`; unauthenticated calls answer 401. Experiment
    runs are scoped to their owner: another user's run id reads as 404, and
    runs recorded before accounts existed (no owner) stay visible to everyone.
    With QUANTLAB_AUTH=off the auth operations answer 404 and every other
    operation behaves exactly as in 0.5.1.

    0.7.0 adds read access to point-in-time fundamentals (feature 008): a
    per-instrument concept catalog (`listInstrumentFundamentalConcepts`) and a
    series endpoint (`getFundamentalSeries`) with three transforms -- `raw`
    (the as-of series: a fact is knowable from its `filed_at`, latest filing
    wins), `raw_facts` (rows exactly as filed) and `yoy_growth`
    (year-over-year change of the as-of series). Every response carries
    `point_in_time: true` and a `provenance` string, and every fact carries
    both `filed_at` (the visibility anchor) and `period_end` (the period
    described). Window filters apply to `filed_at`, never `period_end`.
    Instruments gain a `kind` label (`equity`/`macro`) so BoE/FRED macro
    pseudo-instruments are identifiable; they are labelled, never filtered
    out. The synthetic demo dataset holds no fundamentals and answers both
    operations with empty structures rather than an error.
    0.8.0 adds configurable signal rules (feature 008, M2): the
    `/signal-templates` catalog, `/rules` CRUD (session-scoped like runs), and
    `custom_rule_id` as an alternative model selector on `POST /runs` -- exactly
    one of `model_name` and `custom_rule_id` is required. A custom-rule run
    records a snapshot of the resolved definition (template + config + derived
    lookback) in its `custom_rule` provenance, so editing or deleting the rule
    never rewrites what the run computed; deleting a rule flips
    `model_available` to false on its runs while they stay readable.
    `GET /models` gains `origin` (builtin|custom) and includes the caller's own
    custom rules.
    0.9.0 adds the `fundamental-condition` template (feature 008, M3): a custom
    rule that fires when a fundamental concept's point-in-time series (as-of by
    `filed_at`, latest filing wins, per-holder filings summed) crosses a
    threshold, at level or year-over-year growth. Signals characteristically
    fire ON filing dates. The template declares `inputs:
    "bars+fundamentals"`, reports `available_on_dataset: false` on the
    synthetic demo, and a run attempted with it there answers 422 (the demo
    holds no fundamentals).
servers:
  - url: /api/v1
tags:
  - name: system
  - name: instruments
  - name: signals
  - name: models
  - name: runs
  - name: replay
  - name: auth
  - name: fundamentals
  - name: rules

# Session-cookie auth applies API-wide; the three operations that bootstrap
# it (health, login, first-user register) opt out individually below.
security:
  - sessionCookie: []

paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Service health, including seed status
      security: []
      responses:
        "200":
          description: Backend is up and the seeded database is reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /instruments:
    get:
      tags: [instruments]
      operationId: listInstruments
      summary: List the synthetic instrument universe
      responses:
        "200":
          description: All seeded instruments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstrumentList"

  /instruments/{symbol}/prices:
    get:
      tags: [instruments]
      operationId: getPrices
      summary: Daily OHLCV history for one instrument
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-Z0-9][A-Z0-9._-]{0,19}$"
        - name: start_date
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Bars ordered ascending by date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceBarList"
        "404":
          description: Unknown symbol
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /instruments/{symbol}/fundamentals/concepts:
    get:
      tags: [fundamentals]
      operationId: listInstrumentFundamentalConcepts
      summary: One instrument's fundamentals catalog
      description: >
        One entry per (concept, provider, unit) group stored for the
        instrument, with fact count and filed_at range. Raw XBRL facts the
        ingest did not map onto a canonical concept (empty `concept`) are
        excluded: this catalog names the concepts a series can be requested
        for. Concepts marked `derived` (e.g. `short_volume_ratio` = finra
        short_volume / total_volume) are computed at read time from stored
        concepts, never stored themselves. Empty on the synthetic demo
        dataset, which holds no fundamentals.
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-Z0-9][A-Z0-9._-]{0,19}$"
      responses:
        "200":
          description: Concept groups, ordered by concept, provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FundamentalConceptList"
        "404":
          description: Unknown symbol
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /instruments/{symbol}/fundamentals/series:
    get:
      tags: [fundamentals]
      operationId: getFundamentalSeries
      summary: One instrument's fundamental concept as a point-in-time series
      description: >
        Three transforms over the concept's facts:

          * `raw` -- the point-in-time as-of series: one point per filing
            date, each carrying the value knowable on that date (filed_at <=
            date, latest filing wins). Per-holder filings (FCA short
            positions) are summed across holders per date, each holder's
            latest filing persisting until they file again. With `start_date`,
            an opening point at `start_date` carries the value knowable as of
            that date, so a windowed read does not start from the first filing
            inside the window.
          * `raw_facts` -- the facts exactly as filed, ascending by filed_at,
            with both dates on every row.
          * `yoy_growth` -- year-over-year change of the as-of series; the
            base is the as-of value one year earlier (a step lookup, not a
            calendar guess), and points without a base are dropped.

        `start_date`/`end_date` filter on `filed_at`, never `period_end`:
        asking for a window asks "what was knowable between these dates".
        Every response carries `point_in_time: true` and a `provenance`
        string stating exactly how the numbers were produced.
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-Z0-9][A-Z0-9._-]{0,19}$"
        - name: concept
          in: query
          required: true
          description: Canonical or derived concept, e.g. revenue or short_volume_ratio.
          schema:
            type: string
        - name: transform
          in: query
          required: false
          schema:
            type: string
            enum: [raw, raw_facts, yoy_growth]
            default: raw
        - name: start_date
          in: query
          required: false
          description: First filed_at to include (YYYY-MM-DD).
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          required: false
          description: Last filed_at to include (YYYY-MM-DD).
          schema:
            type: string
            format: date
      responses:
        "200":
          description: The transformed series
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FundamentalSeries"
        "400":
          description: start_date after end_date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown symbol
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /signals:
    get:
      tags: [signals]
      operationId: listSignals
      summary: List signals with filtering, sorting, and total count
      description: >
        `total` always reflects the full result set under the active filters,
        independent of pagination, so the UI count can be checked against the
        backend (SC-004).
      parameters:
        - name: instrument
          in: query
          required: false
          schema:
            type: string
            pattern: "^[A-Z0-9][A-Z0-9._-]{0,19}$"
        - name: signal_type
          in: query
          required: false
          description: Signal rule name, e.g. sma-crossover
          schema:
            type: string
        - name: direction
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Direction"
        - name: start_date
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [date_asc, date_desc]
            default: date_desc
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Filtered signals with total count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalList"
        "400":
          description: Invalid filter combination (e.g. start_date after end_date)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /models:
    get:
      tags: [models]
      operationId: listModels
      summary: Catalog of registered signal models, discovered at runtime
      description: >
        Enumerates every model currently registered in the backend plugin
        registry, with its declared parameter metadata (Constitution II).
        Registering a model MUST make it appear here with no change to this
        document's consumers.
      responses:
        "200":
          description: Registered models
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelList"

  /runs:
    post:
      tags: [runs]
      operationId: createRun
      summary: Run a model over a dataset selection
      description: >
        Validates the requested parameters against the model's declared
        metadata, resolves a warm-up window of the model's lookback_days before
        start_date, executes, and returns the completed run. Signals dated
        outside [start_date, end_date] are computed for warm-up but not
        reported. Execution is synchronous; see research.md for the scaling
        boundary this implies.

        An optional `execution` object records user-settable execution
        criteria (capital, sizing, costs, stops, fill timing) with the run.
        The criteria do not change the signals; they change how the run's
        performance report turns those signals into fills, so they are stored
        as provenance and echoed back on the run.

        The model is selected by `model_name` (a registry builtin) or
        `custom_rule_id` (one of the caller's rules from POST /rules) --
        exactly one of the two. A custom rule's config is fixed at definition
        time, so `parameters` overrides cannot combine with `custom_rule_id`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunRequest"
      responses:
        "201":
          description: Run completed (a run producing zero signals is a success)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "404":
          description: >
            Unknown model, unknown custom_rule_id (including one owned by
            another user), or an unknown symbol in the selection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: >
            Both or neither model selector sent, parameter outside its
            declared range, window shorter than the model's lookback,
            start_date after end_date, a selection larger than the permitted
            bound, or a template whose declared inputs the active dataset
            cannot serve (fundamentals on the synthetic demo). The offending
            field is named.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      tags: [runs]
      operationId: listRuns
      summary: List recorded runs, newest first
      parameters:
        - name: saved_only
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: When true, return only runs saved with a name.
      responses:
        "200":
          description: Recorded runs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunList"

  /runs/{run_id}:
    parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [runs]
      operationId: getRun
      summary: One run with its provenance, summary, and produced signals
      responses:
        "200":
          description: The run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunDetail"
        "404":
          description: Unknown run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      tags: [runs]
      operationId: saveRun
      summary: Name a run to keep it as a saved experiment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
      responses:
        "200":
          description: Updated run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "404":
          description: Unknown run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [runs]
      operationId: deleteRun
      summary: Delete a run and the signals it produced
      responses:
        "204":
          description: Deleted
        "404":
          description: Unknown run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /runs/{run_id}/performance:
    parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [runs]
      operationId: getRunPerformance
      summary: Equity curve, benchmark, trades and risk metrics for one run
      description: >
        Derived from the run's own signals and the bars inside its window, and
        computed here because the frontend must not embed analytical
        computation (Constitution V). Recomputed on request rather than stored:
        every input is already persisted, so a cached copy could only go stale.

        Not a tradeable backtest. `assumptions` lists every simplification
        applied and ships inside the payload, so the caveat travels with the
        numbers rather than living in UI copy that a refactor can drop.
      responses:
        "200":
          description: Performance of the run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunPerformance"
        "404":
          description: Unknown run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >
            The run failed, so it has no performance. Zeroed figures would read
            as a flat book rather than as an absent result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /runs/{run_id}/replay/stream:
    parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [replay]
      operationId: streamRunReplay
      summary: Replay a run's window as a server-sent event stream
      description: >
        Streams the run's window chronologically, as if history were arriving
        live: each trading date's bars, the stored signals firing that date,
        the fills the simulator executes at that date's close, and one
        end-of-date equity mark, ending with a summary event. The body is a
        sequence of `data: {json}\n\n` frames; every frame's JSON object
        carries an `event` field, one of:

          * `bar` -- `{date, closes}`: the date's close per run symbol. Thinned
            to every `step`-th date; a date carrying a signal always gets one.
          * `signal` -- `{date, symbol, direction, trigger_values,
            data_window_end}`: a stored signal as it fires.
          * `fill` -- `{date, symbol, side, qty, price, value,
            realized_pnl}`: an executed trade at the close of the signal date.
          * `equity` -- `{date, equity, cash, positions, realized_pnl}`: the
            book marked once per replayed date, after that date's fills.
          * `summary` -- terminal; the ReplaySummary object.
          * `truncated` -- terminal in place of `summary` when `max_events`
            cut the stream short: `{event, detail}`.

        Events on one date arrive in bar, signal, fill, equity order, so a
        signal never precedes the bar event of its own date. Sizing and
        filling mirror the run's performance report exactly (equal-weight
        per-symbol sleeves, close-of-signal-date fills, no costs): the
        terminal `summary` reconciles with GET /runs/{run_id}/performance.
      parameters:
        - name: interval_ms
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 10000
            default: 0
          description: >
            Optional server-side pacing: milliseconds to wait between dates
            (after each equity event). 0 streams as fast as possible; the
            data is historical, so clients may pace themselves instead.
        - name: max_events
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 5000000
            default: 250000
          description: >
            Safety cap on frames emitted. On reaching it the stream ends with
            a `truncated` frame instead of `summary`.
        - name: step
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Emit bar events only every Nth date; 1 is every date.
      responses:
        "200":
          description: Server-sent event stream of replay events
          content:
            text/event-stream:
              schema:
                type: string
                description: "One `data: {json}\\n\\n` frame per replay event."
        "404":
          description: Unknown run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The run failed, so there is nothing to replay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /runs/{run_id}/replay/summary:
    parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [replay]
      operationId: getRunReplaySummary
      summary: The replay engine run to completion, as one object
      description: >
        Drives the same engine as the stream endpoint to completion and
        returns only its terminal summary event. Useful for clients that do
        not want SSE, and the cheapest way to check a replay reconciles with
        GET /runs/{run_id}/performance.
      responses:
        "200":
          description: Replay summary for the run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplaySummary"
        "404":
          description: Unknown run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The run failed, so there is nothing to replay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /replay/live/stream:
    get:
      tags: [replay]
      operationId: streamLiveReplay
      summary: Replay a Kafka bar stream live, as a server-sent event stream
      description: >
        The streaming counterpart of GET /runs/{run_id}/replay/stream. A
        publisher (`quantlab replay-publish`) has turned a warehouse window
        into a chronological bar stream on the Kafka replay topic; this
        endpoint consumes the topic from the beginning, re-runs the model's
        compute on each symbol's growing window as bars arrive (identical to
        batch by the point-in-time truncation guarantee), and trades the new
        signals through the same portfolio simulator.

        The frame format is exactly the batch replay's: `bar`, `signal`,
        `fill`, `equity` and a terminal `summary` (whose `run_id` is
        `live:<model>`), plus `truncated` if `max_events` cuts the stream
        short. Bars dated before `start` act as warm-up: they feed the
        model's lookback but emit no events and no trades, mirroring how a
        batch run loads history before its window. Because of that warm-up,
        the terminal summary reconciles with a batch replay of a run over the
        same model, symbols and window when the publisher's range covers the
        model's lookback before `start`.

        Requires the streaming stack (`docker compose --profile streaming
        up`). A 503 means the bus is unconfigured (QUANTLAB_KAFKA_BROKERS
        unset) or the broker is unreachable -- never a startup failure.
      parameters:
        - name: model
          in: query
          required: false
          schema:
            type: string
            default: sma-crossover
          description: Signal rule name; the latest registered version is used.
        - name: symbols
          in: query
          required: true
          schema:
            type: string
          description: Comma-separated canonical symbols, e.g. `ZX1.US,ZX2.US`.
        - name: start
          in: query
          required: true
          schema:
            type: string
            format: date
          description: First session date of the replayed window.
        - name: end
          in: query
          required: true
          schema:
            type: string
            format: date
          description: Last session date of the replayed window.
        - name: params
          in: query
          required: false
          schema:
            type: string
          description: >
            Model parameter overrides as a JSON object, e.g.
            `{"fast": 10, "slow": 30}`.
        - name: initial_cash
          in: query
          required: false
          schema:
            type: number
            exclusiveMinimum: 0
            default: 100000
          description: Starting book value, split into equal per-symbol sleeves.
        - name: max_events
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 5000000
            default: 250000
          description: >
            Safety cap on frames emitted. On reaching it the stream ends with
            a `truncated` frame instead of `summary`.
      responses:
        "200":
          description: Server-sent event stream of replay events
          content:
            text/event-stream:
              schema:
                type: string
                description: "One `data: {json}\\n\\n` frame per replay event."
        "400":
          description: Missing or malformed symbols, start, end or params
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: A parameter override failed the model's declared spec
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: The event bus is unconfigured or unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /signal-templates:
    get:
      tags: [models]
      operationId: listSignalTemplates
      summary: Catalog of signal templates custom rules are built from
      description: >
        Templates, not expressions: a custom rule is a template id plus a
        config whose fields come from the fixed enums in `config_fields`.
        `inputs` declares what the template reads ("bars"; "bars+fundamentals"
        arrives later), and `available_on_dataset` reports whether the active
        dataset can serve it -- fundamental templates report false on the
        SQLite demo. Registry-driven: a new template appears here with no
        change to consumers.
      responses:
        "200":
          description: Registered templates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalTemplateList"

  /rules:
    post:
      tags: [rules]
      operationId: createCustomRule
      summary: Define a custom signal rule from a template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomRuleRequest"
      responses:
        "201":
          description: Rule created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomRule"
        "404":
          description: Unknown template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Config failed the template's declared validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      tags: [rules]
      operationId: listCustomRules
      summary: List the caller's custom rules
      responses:
        "200":
          description: Rules owned by the caller plus unscoped ones
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomRuleList"

  /rules/{rule_id}:
    parameters:
      - name: rule_id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [rules]
      operationId: getCustomRule
      summary: One custom rule
      responses:
        "200":
          description: The rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomRule"
        "404":
          description: Unknown rule, or one owned by another user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      tags: [rules]
      operationId: updateCustomRule
      summary: Rename a rule or replace its config
      description: >
        The template is immutable: changing what a rule IS makes a new rule.
        Runs that already used the rule keep their definition snapshot; edits
        apply to future runs only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomRuleUpdateRequest"
      responses:
        "200":
          description: Updated rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomRule"
        "404":
          description: Unknown rule, or one owned by another user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Empty patch, or config failed template validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [rules]
      operationId: deleteCustomRule
      summary: Delete a rule
      description: >
        Runs that used the rule stay readable (their definition snapshot is
        recorded on the run) and report model_available=false.
      responses:
        "204":
          description: Deleted
        "404":
          description: Unknown rule, or one owned by another user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/register:
    post:
      tags: [auth]
      operationId: registerUser
      summary: Register a user
      # Bootstrap-gated: public while zero users exist, then admin-only.
      security: []
      description: >
        Public only while no users exist; that first user is created with
        `is_admin: true`. Once any user exists, registration requires an
        admin's session cookie and new users are created non-admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthCredentials"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Users exist and the caller has no session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Users exist and the caller is not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Username already taken (comparison is case-insensitive)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Username or password outside its declared bounds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Log in, receiving the session cookie
      security: []
      description: >
        On success sets the `quantlab_session` cookie (HttpOnly,
        SameSite=Lax; Secure only when QUANTLAB_AUTH_COOKIE_SECURE is set,
        since local development is plain http). Failed attempts are rate
        limited per client IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthCredentials"
      responses:
        "200":
          description: Logged in; the session cookie is set
          headers:
            Set-Cookie:
              description: >
                `quantlab_session=<token>; HttpOnly; SameSite=Lax; Path=/;
                Max-Age=1209600` (`Secure` only behind
                QUANTLAB_AUTH_COOKIE_SECURE)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Invalid username or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Username or password outside its declared bounds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many failed attempts from this client IP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Log out, revoking the session
      responses:
        "204":
          description: Session deleted; the cookie is cleared
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/me:
    get:
      tags: [auth]
      operationId: getCurrentUser
      summary: The authenticated user
      responses:
        "200":
          description: The caller's identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPublic"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: quantlab_session
      description: >
        Opaque session token issued by POST /auth/login, stored by the
        backend only as its SHA-256, valid for 14 days since last use.
  schemas:
    Dataset:
      type: string
      enum: [sqlite, warehouse]
      description: >
        Which store answered. `sqlite` is the synthetic demo dataset;
        `warehouse` is real ingested history. Two runs from different datasets
        are never directly comparable.

    CorporateActionNotice:
      type: object
      additionalProperties: false
      required: [instrument_id, symbol, ex_date, action_type]
      description: >
        A split or dividend inside a run's window. Reported, never applied:
        stored bars are unadjusted, so a split makes the price series jump in a
        way that is an artefact rather than a market move.
      properties:
        instrument_id:
          type: integer
        symbol:
          type: string
        ex_date:
          type: string
          format: date
        action_type:
          type: string
          enum: [split, dividend]
        split_ratio:
          type: number
          nullable: true
        dividend:
          type: number
          nullable: true

    Health:
      type: object
      required: [status, dataset, seeded, signal_count]
      properties:
        status:
          type: string
          enum: [ok]
        dataset:
          $ref: "#/components/schemas/Dataset"
        seeded:
          type: boolean
          description: True once the seed step has completed
        signal_count:
          type: integer
          minimum: 0

    Direction:
      type: string
      enum: [bullish, bearish]

    Instrument:
      type: object
      required: [symbol, name, currency, kind, regime_profile]
      properties:
        symbol:
          type: string
          example: ZZTRND
        name:
          type: string
          example: Zeno Trend Industries (synthetic)
        currency:
          type: string
          example: USD
        kind:
          type: string
          enum: [equity, macro]
          description: >
            `macro` labels the warehouse's BoE/FRED pseudo-instruments (a
            macro series loaded as daily bars). It labels, never filters:
            macro instruments are served like any other instrument.
        regime_profile:
          type: string
          enum: [trending, mean_reverting, volatile, mixed]

    InstrumentList:
      type: object
      required: [total, items]
      properties:
        total:
          type: integer
          minimum: 0
        items:
          type: array
          items:
            $ref: "#/components/schemas/Instrument"

    PriceBar:
      type: object
      required: [symbol, date, open, high, low, close, volume]
      properties:
        symbol:
          type: string
        date:
          type: string
          format: date
        open:
          type: number
        high:
          type: number
        low:
          type: number
        close:
          type: number
        volume:
          type: integer
          minimum: 0

    PriceBarList:
      type: object
      required: [total, items]
      properties:
        total:
          type: integer
          minimum: 0
        items:
          type: array
          items:
            $ref: "#/components/schemas/PriceBar"

    FundamentalConcept:
      type: object
      additionalProperties: false
      required:
        - concept
        - provider
        - unit
        - fact_count
        - first_filed
        - last_filed
        - derived
      properties:
        concept:
          type: string
          example: revenue
        provider:
          type: string
          example: sec_edgar
        unit:
          type: string
          example: USD
        fact_count:
          type: integer
          minimum: 0
        first_filed:
          type: string
          format: date
        last_filed:
          type: string
          format: date
        derived:
          type: boolean
          description: >
            True for concepts computed at read time from stored ones (e.g.
            short_volume_ratio = finra short_volume / total_volume); derived
            concepts are never themselves stored.

    FundamentalConceptList:
      type: object
      required: [symbol, total, items]
      properties:
        symbol:
          type: string
        total:
          type: integer
          minimum: 0
        items:
          type: array
          items:
            $ref: "#/components/schemas/FundamentalConcept"

    FundamentalFact:
      type: object
      additionalProperties: false
      required:
        - value
        - period_start
        - period_end
        - filed_at
        - provider
        - unit
        - holder
      properties:
        value:
          type: number
        period_start:
          type: string
          format: date
          nullable: true
          description: Null for instantaneous (balance-sheet) facts.
        period_end:
          type: string
          format: date
          description: The fiscal period the value describes. Never a visibility anchor.
        filed_at:
          type: string
          format: date
          description: >
            When the market could first know this value. The point-in-time
            anchor: a fact is visible to a model only from filed_at onwards.
        provider:
          type: string
          example: sec_edgar
        unit:
          type: string
          example: USD
        holder:
          type: string
          nullable: true
          description: Present on per-holder filings (FCA short positions).

    FundamentalSeriesPoint:
      type: object
      additionalProperties: false
      required: [date, value]
      properties:
        date:
          type: string
          format: date
        value:
          type: number
          description: The value knowable on that date (the as-of step series).

    FundamentalSeries:
      type: object
      additionalProperties: false
      required:
        - symbol
        - concept
        - transform
        - point_in_time
        - provenance
        - total
        - items
      properties:
        symbol:
          type: string
        concept:
          type: string
        transform:
          type: string
          enum: [raw, raw_facts, yoy_growth]
        point_in_time:
          type: boolean
          description: >
            Always true: filed_at is the visibility axis on every transform.
            The flag ships so the UI never has to infer the discipline.
        provenance:
          type: string
          description: How the numbers were produced, stated with the numbers.
        total:
          type: integer
          minimum: 0
        items:
          type: array
          description: >
            Series points for `raw`/`yoy_growth`; facts as filed for
            `raw_facts`.
          items:
            oneOf:
              - $ref: "#/components/schemas/FundamentalSeriesPoint"
              - $ref: "#/components/schemas/FundamentalFact"

    Signal:
      type: object
      required:
        - id
        - symbol
        - date
        - rule_name
        - rule_version
        - parameters
        - direction
        - trigger_values
        - data_window_end
      properties:
        id:
          type: integer
        symbol:
          type: string
        date:
          type: string
          format: date
          description: Signal date T; only data knowable by T was used
        rule_name:
          type: string
          example: sma-crossover
        rule_version:
          type: string
          example: 1.0.0
        parameters:
          type: object
          additionalProperties: true
          example: { fast: 20, slow: 50 }
        direction:
          $ref: "#/components/schemas/Direction"
        trigger_values:
          type: object
          additionalProperties: true
          description: Indicator values that fired the rule
          example: { sma_fast: 101.2, sma_slow: 99.8 }
        data_window_end:
          type: string
          format: date
          description: Latest bar date used as input; always <= date (Constitution VII)

    SignalList:
      type: object
      required: [total, items]
      properties:
        total:
          type: integer
          minimum: 0
          description: Total signals matching the active filters (pre-pagination)
        items:
          type: array
          items:
            $ref: "#/components/schemas/Signal"

    Error:
      type: object
      required: [detail]
      properties:
        detail:
          type: string

    AuthCredentials:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          minLength: 8
          maxLength: 256

    User:
      type: object
      additionalProperties: false
      required: [id, username, is_admin]
      properties:
        id:
          type: integer
        username:
          type: string
        is_admin:
          type: boolean

    UserPublic:
      type: object
      additionalProperties: false
      required: [id, username]
      properties:
        id:
          type: integer
        username:
          type: string

    ParamSpec:
      type: object
      additionalProperties: false
      required: [name, type, default]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [int, float, bool, enum]
        default: {}
        minimum:
          type: number
          nullable: true
          description: Inclusive lower bound; numeric types only.
        maximum:
          type: number
          nullable: true
          description: Inclusive upper bound; numeric types only.
        choices:
          type: array
          nullable: true
          items: {}
          description: Permitted values; required when type is enum.
        description:
          type: string

    Model:
      type: object
      additionalProperties: false
      required:
        - name
        - version
        - parameters
        - lookback_days
        - scale_class
        - direction_semantics
        - origin
        - custom_rule_id
        - template
      properties:
        name:
          type: string
          example: sma-crossover
        version:
          type: string
          example: 1.0.0
        parameters:
          type: array
          items:
            $ref: "#/components/schemas/ParamSpec"
        lookback_days:
          type: integer
          minimum: 1
          description: Bars of history the model needs before it can emit.
        scale_class:
          type: string
          enum: [scale_free, price_scaled]
        direction_semantics:
          type: string
        origin:
          type: string
          enum: [builtin, custom]
        custom_rule_id:
          type: string
          nullable: true
          description: Present for custom rules; use it as custom_rule_id on POST /runs.
        template:
          type: string
          nullable: true
          description: The template a custom rule instantiates; null for builtins.

    ModelList:
      type: object
      additionalProperties: false
      required: [total, items]
      properties:
        total:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/Model"

    RunRequest:
      type: object
      additionalProperties: false
      required: [symbols, start_date, end_date]
      properties:
        model_name:
          type: string
          description: >
            Registry builtin model. Exactly one of model_name and
            custom_rule_id is required.
        model_version:
          type: string
          description: Omit to use the highest registered version.
        custom_rule_id:
          type: string
          description: >
            One of the caller's rules from POST /rules. Mutually exclusive
            with model_name; parameters overrides do not apply to custom
            rules (their config is fixed at definition time).
        parameters:
          type: object
          additionalProperties: true
          description: >
            Overrides only. Omitted parameters take the model's declared
            default; the merged result is recorded as the run's effective
            parameters.
        symbols:
          type: array
          minItems: 1
          items:
            type: string
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        execution:
          $ref: "#/components/schemas/ExecutionCriteria"

    CustomRuleSnapshot:
      type: object
      additionalProperties: false
      required: [rule_id, name, slug, template, config, lookback_days]
      description: >
        The definition a custom-rule run actually executed, frozen at run
        time: template + config + derived lookback. Editing or deleting the
        rule afterwards never rewrites this.
      properties:
        rule_id:
          type: string
        name:
          type: string
        slug:
          type: string
        template:
          type: string
          example: indicator-threshold
        config:
          type: object
          additionalProperties: true
        lookback_days:
          type: integer
          minimum: 1

    CustomRuleRequest:
      type: object
      additionalProperties: false
      required: [name, template, config]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        template:
          type: string
          description: Template id from GET /signal-templates.
        config:
          type: object
          additionalProperties: true
          description: Validated against the template's declared vocabulary.

    CustomRuleUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        config:
          type: object
          additionalProperties: true
      description: At least one of name and config is required.

    CustomRule:
      type: object
      additionalProperties: false
      required:
        - rule_id
        - name
        - slug
        - template
        - config
        - lookback_days
        - created_at
        - updated_at
      properties:
        rule_id:
          type: string
        name:
          type: string
        slug:
          type: string
          description: Derived from the name; unique within the owner's scope.
        template:
          type: string
        config:
          type: object
          additionalProperties: true
        lookback_days:
          type: integer
          minimum: 1
          description: Derived from the config, not declared.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CustomRuleList:
      type: object
      additionalProperties: false
      required: [total, items]
      properties:
        total:
          type: integer
          minimum: 0
        items:
          type: array
          items:
            $ref: "#/components/schemas/CustomRule"

    SignalTemplate:
      type: object
      additionalProperties: false
      required:
        - id
        - version
        - description
        - inputs
        - available_on_dataset
        - config_fields
      properties:
        id:
          type: string
          example: indicator-threshold
        version:
          type: string
          example: 1.0.0
        description:
          type: string
        inputs:
          type: string
          enum: [bars, "bars+fundamentals"]
          description: What the template reads.
        available_on_dataset:
          type: boolean
          description: >
            Whether the active dataset can serve this template. Fundamental
            templates report false on the SQLite demo.
        config_fields:
          type: object
          additionalProperties: true
          description: Enums and bounds per config field, for form generation.

    SignalTemplateList:
      type: object
      additionalProperties: false
      required: [total, items]
      properties:
        total:
          type: integer
          minimum: 0
        items:
          type: array
          items:
            $ref: "#/components/schemas/SignalTemplate"

    ExecutionCriteria:
      type: object
      additionalProperties: false
      description: >
        How a run's signals are turned into fills in its performance report.
        Every field defaults to the historical behaviour, so omitting the
        object entirely and supplying it with all defaults produce the same
        numbers: an equal-weight sleeve per selected instrument, filled at the
        close of the signal date, charged nothing, capped at nothing.
      properties:
        initial_capital:
          type: number
          exclusiveMinimum: 0
          default: 100000
          description: Starting book value.
        position_sizing:
          type: string
          enum: [equal_weight, fixed_fraction]
          default: equal_weight
          description: >
            `equal_weight` splits initial_capital into one sleeve per selected
            instrument (an untraded sleeve sits in cash). `fixed_fraction`
            sizes each entry at `fraction` of the book's current value, drawn
            from one shared cash account.
        fraction:
          type: number
          exclusiveMinimum: 0
          maximum: 1
          default: 0.1
          description: Share of the book's current value per entry; fixed_fraction only.
        max_open_positions:
          type: integer
          minimum: 1
          nullable: true
          default: null
          description: >
            Cap on concurrently open positions; entries beyond the cap are
            skipped. Null means uncapped.
        transaction_cost_bps:
          type: number
          minimum: 0
          default: 0
          description: Charged on every fill, as basis points of traded value.
        fixed_cost_per_trade:
          type: number
          minimum: 0
          default: 0
          description: Charged on every fill, in currency units.
        stop_loss_pct:
          type: number
          exclusiveMinimum: 0
          exclusiveMaximum: 1
          nullable: true
          default: null
          description: >
            Exit when a bar's low trades this fraction below the entry price;
            filled at the stop level, or at the open when the market gaps
            through it. When a stop and a take-profit trigger on the same bar,
            the stop is assumed to fill first.
        take_profit_pct:
          type: number
          exclusiveMinimum: 0
          nullable: true
          default: null
          description: >
            Exit when a bar's high trades this fraction above the entry price;
            filled at the target level, or at the open on a gap through it.
        entry_price:
          type: string
          enum: [same_close, next_open]
          default: same_close
          description: >
            `same_close` fills at the close of the signal date. `next_open`
            fills at the open of the next session that has a bar, removing the
            same-bar fill assumption.

    RunCoverage:
      type: object
      additionalProperties: false
      required: [instruments_requested, instruments_with_data, instruments_full_warmup]
      properties:
        instruments_requested:
          type: integer
          minimum: 1
        instruments_with_data:
          type: integer
          minimum: 0
          description: How many requested instruments had bars in the window.
        instruments_full_warmup:
          type: integer
          minimum: 0
          description: >
            How many had the model's full lookback before start_date. The
            remainder may under-report early in the window.

    Run:
      type: object
      additionalProperties: false
      required:
        - id
        - model_name
        - model_version
        - parameters
        - symbols
        - start_date
        - end_date
        - status
        - created_at
        - signal_count
        - coverage
        - dataset
      properties:
        id:
          type: string
        name:
          type: string
          nullable: true
          description: Set when saved as a named experiment; null otherwise.
        model_name:
          type: string
        model_version:
          type: string
        parameters:
          type: object
          additionalProperties: true
          description: Effective parameters (declared defaults merged with overrides).
        symbols:
          type: array
          items:
            type: string
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        status:
          type: string
          enum: [completed, failed]
        error:
          type: string
          nullable: true
          description: Present when status is failed.
        created_at:
          type: string
          format: date-time
        signal_count:
          type: integer
          minimum: 0
          description: Zero is a valid result, not a failure.
        coverage:
          $ref: "#/components/schemas/RunCoverage"
        dataset:
          $ref: "#/components/schemas/Dataset"
        instrument_ids:
          type: array
          nullable: true
          items:
            type: integer
          description: >
            Surrogate instrument identities actually run against. Present for
            warehouse runs, null on the demo. Recorded because the canonical
            symbol is unique but editable, while instrument_id is the stable
            key the bar store joins on.
        ingest_run_ids:
          type: array
          nullable: true
          items:
            type: integer
          description: >
            The ingest runs behind the bars this run read. This is what makes a
            later re-ingest of the same window distinguishable from the
            original run, when every input the researcher chose is identical.
        corporate_actions:
          type: array
          items:
            $ref: "#/components/schemas/CorporateActionNotice"
          description: >
            Actions overlapping the window for the selected instruments. Empty
            on the demo dataset, which has none.
        execution:
          $ref: "#/components/schemas/ExecutionCriteria"
          nullable: true
          description: >
            The effective execution criteria the run was created with, merged
            over their defaults. Null for runs recorded without them; their
            performance uses the historical zero-cost measuring instrument.
        custom_rule:
          $ref: "#/components/schemas/CustomRuleSnapshot"
          nullable: true
          description: >
            Set on runs of a custom rule: the definition snapshot. Null for
            builtin-model runs.
        re_runnable:
          type: boolean
          description: >
            False when the run's recorded dataset is not the active one. The
            run stays readable; it simply cannot be reproduced as recorded.
        model_available:
          type: boolean
          description: >
            False when the recorded model/version is no longer registered; the
            run stays readable but is not re-runnable.

    RunList:
      type: object
      additionalProperties: false
      required: [total, items]
      properties:
        total:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/Run"

    ExperimentSignal:
      type: object
      additionalProperties: false
      required: [symbol, date, direction, trigger_values, data_window_end]
      properties:
        symbol:
          type: string
        date:
          type: string
          format: date
        direction:
          $ref: "#/components/schemas/Direction"
        trigger_values:
          type: object
          additionalProperties: true
        data_window_end:
          type: string
          format: date
          description: >
            Latest bar date used as input; always <= date (point-in-time proof,
            Constitution VII).

    RunDetail:
      allOf:
        - $ref: "#/components/schemas/Run"
        - type: object
          required: [signals]
          properties:
            signals:
              type: array
              items:
                $ref: "#/components/schemas/ExperimentSignal"

    EquityPoint:
      type: object
      additionalProperties: false
      required: [date, value]
      properties:
        date:
          type: string
          format: date
        value:
          type: number
          description: Book value on that date, in units of initial_capital.

    Trade:
      type: object
      additionalProperties: false
      required:
        - symbol
        - entry_date
        - entry_price
        - exit_date
        - exit_price
        - return_pct
        - open
      properties:
        symbol:
          type: string
        entry_date:
          type: string
          format: date
        entry_price:
          type: number
        exit_date:
          type: string
          format: date
          nullable: true
          description: Null while the position is still open at the end of the window.
        exit_price:
          type: number
          description: >
            Realised exit for a closed trade; the last close for an open one.
        return_pct:
          type: number
        open:
          type: boolean
          description: >
            True when the position was still held at the end of the window. An
            open trade is marked to market, not realised, and never counts
            toward the win rate.

    PerformanceMetrics:
      type: object
      additionalProperties: false
      required:
        - total_return
        - sharpe_ratio
        - max_drawdown
        - win_rate
        - trade_count
        - winning_trades
        - losing_trades
      properties:
        total_return:
          type: number
          description: Fraction, e.g. 0.12 for +12%.
        sharpe_ratio:
          type: number
          nullable: true
          description: >
            Annualised from daily returns at a zero risk-free rate. Null when
            undefined -- fewer than two points, or zero variance. A fabricated
            0.0 would read as "measured, and mediocre".
        max_drawdown:
          type: number
          description: >
            Negative fraction, e.g. -0.153 for a 15.3% peak-to-trough fall.
            Exactly 0 for a curve that never fell.
        win_rate:
          type: number
          nullable: true
          description: >
            Share of *closed* trades that gained. Null when nothing has closed.
        trade_count:
          type: integer
          minimum: 0
          description: All positions, including any still open.
        winning_trades:
          type: integer
          minimum: 0
        losing_trades:
          type: integer
          minimum: 0

    RunPerformance:
      type: object
      additionalProperties: false
      required:
        - run_id
        - initial_capital
        - equity
        - benchmark
        - metrics
        - trades
        - assumptions
      properties:
        run_id:
          type: string
        initial_capital:
          type: number
          description: >
            Notional book size. Arbitrary but fixed: every ratio reported here
            is scale-invariant, so this only sets the axis labels.
        equity:
          type: array
          items:
            $ref: "#/components/schemas/EquityPoint"
          description: >
            The strategy's book, marked to close on each bar date in the
            window. Empty when the window contained no bars.
        benchmark:
          type: array
          items:
            $ref: "#/components/schemas/EquityPoint"
          description: >
            Equal-weight buy-and-hold of the same selection. Deliberately the
            run's own universe rather than an index, so the comparison isolates
            the model's timing from which names it was pointed at.
        metrics:
          $ref: "#/components/schemas/PerformanceMetrics"
        trades:
          type: array
          items:
            $ref: "#/components/schemas/Trade"
        assumptions:
          type: array
          items:
            type: string
          description: >
            Every simplification applied. These figures are not tradeable and
            must never be presented as if they were.

    ReplaySummary:
      type: object
      additionalProperties: false
      required:
        - run_id
        - days
        - initial_cash
        - final_equity
        - total_return
        - sharpe_ratio
        - max_drawdown
        - win_rate
        - trade_count
        - winning_trades
        - losing_trades
        - assumptions
      description: >
        The terminal event of a run's replay. Metrics are computed by the same
        helpers behind GET /runs/{run_id}/performance, over the replayed
        equity curve and trade list, so the two reconcile on the same run.
      properties:
        run_id:
          type: string
        days:
          type: integer
          minimum: 0
          description: Trading dates replayed (dates with at least one bar).
        initial_cash:
          type: number
        final_equity:
          type: number
          description: Book value on the last replayed date.
        total_return:
          type: number
          description: Fraction, e.g. 0.12 for +12%.
        sharpe_ratio:
          type: number
          nullable: true
          description: Null when undefined -- fewer than two points, or zero variance.
        max_drawdown:
          type: number
          description: Negative fraction, peak to trough.
        win_rate:
          type: number
          nullable: true
          description: Share of closed trades that gained. Null when nothing closed.
        trade_count:
          type: integer
          minimum: 0
          description: All positions, including any still open.
        winning_trades:
          type: integer
          minimum: 0
        losing_trades:
          type: integer
          minimum: 0
        assumptions:
          type: array
          items:
            type: string
          description: >
            Every simplification applied, shared with the performance report.
            These figures are not tradeable and must never be presented as if
            they were.
