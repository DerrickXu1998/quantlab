# QuantLab — production stack for a single Compute Engine VM (e2-standard-2).
#
# This file is deliberately NOT an override of the repository's
# docker-compose.yml. That one builds from source and publishes database ports
# to the host for local work; this one only ever pulls pre-built images from
# Artifact Registry and keeps the datastores off the public interface. Mixing
# the two with `-f a.yml -f b.yml` would inherit the build contexts (absent on
# the VM) and the public port bindings, so the production host runs this file
# alone:
#
#     docker compose -f docker-compose.prod.yml --env-file .env up -d
#
# The datastores run here, as containers: bars in ClickHouse, the catalog in
# Postgres. Their data lives on the VM's separate data disk, mounted at
# QUANTLAB_DATA_DIR (default /mnt/disks/quantlab -- see
# deploy/prepare-data-disk.sh), never on the boot disk: the boot disk is 30 GB
# and mostly images, and a database that fills it takes every service down.
# remote-deploy.sh refuses to deploy unless that disk is mounted, because
# Docker would otherwise create the directories on the boot disk and both
# servers would initialise EMPTY -- an API serving nothing, quietly.
#
# Self-hosted rather than managed (ClickHouse Cloud, managed Postgres) since
# October 2026: the managed services sat in London while this VM is in Iowa,
# so every query crossed the Atlantic, and both bills outgrew the VM's. Moving
# an existing VM back is a one-time copy -- see deploy/migrate-to-selfhost.sh
# and docs/DEPLOY.md.
#
# Passwords: QUANTLAB_PG_PASSWORD / QUANTLAB_CH_PASSWORD are both what the
# servers are initialised with and what the clients send (PGPASSWORD is set
# from the former). They are baked into the data directories on first start;
# changing them in .env alone does NOT change them in the databases.
#
# Memory budget (host has 8 GiB): clickhouse 2.5G + postgres 1G + backend 1G +
# caddy 128M, plus the on-demand ingest container's 2G.

name: quantlab

x-logging: &logging
  # The boot disk is the only disk. Unbounded JSON logs fill it in a week and
  # every service fails at once, which is a confusing way to discover disk.
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # --------------------------------------------------------------------------
  # Bars. Append-only price history; the large one (hundreds of millions of
  # rows, several GB compressed).
  # --------------------------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    environment:
      CLICKHOUSE_USER: ${QUANTLAB_CH_USER:?set QUANTLAB_CH_USER in .env}
      # Bare `:?`: secret scanners read `PASSWORD: <anything>` as a literal and
      # flag an error message there as a hardcoded credential.
      CLICKHOUSE_PASSWORD: ${QUANTLAB_CH_PASSWORD:?}
      CLICKHOUSE_DB: quantlab
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - ${QUANTLAB_DATA_DIR:-/mnt/disks/quantlab}/clickhouse:/var/lib/clickhouse
      - ./clickhouse-limits.xml:/etc/clickhouse-server/config.d/limits.xml:ro
      - ./clickhouse-users.xml:/etc/clickhouse-server/users.d/quantlab-profile.xml:ro
    ports:
      # Loopback only: for an operator on the VM, never the internet.
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      # 127.0.0.1, not localhost: inside the container localhost resolves to
      # ::1 and the server listens on IPv4, so the probe would never connect.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2560M
    logging: *logging
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Catalog. Instruments, symbol maps, universes, signals, runs, accounts.
  # Postgres 18: the managed service it was copied from ran 18, and a dump
  # cannot be restored into an older server.
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:18-alpine
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - max_connections=50
    environment:
      POSTGRES_USER: ${QUANTLAB_PG_USER:?set QUANTLAB_PG_USER in .env}
      POSTGRES_PASSWORD: ${QUANTLAB_PG_PASSWORD:?}
      POSTGRES_DB: quantlab
      # Deterministic collation: index order must not depend on the host locale.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      # The parent directory, not .../data: from 18 the image keeps PGDATA in a
      # major-version subdirectory (/var/lib/postgresql/18/docker) so a future
      # pg_upgrade can sit beside it.
      - ${QUANTLAB_DATA_DIR:-/mnt/disks/quantlab}/postgres:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d quantlab"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1024M
    logging: *logging
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Edge. Terminates TLS and is the only service bound to a public port.
  #
  # This VM serves the API only -- the SPA is built and served by Vercel from
  # the same repository, so shipping a second copy here would be two builds of
  # one artefact. That makes the browser's request cross-origin, which has two
  # consequences the same-origin arrangement did not have:
  #
  #   1. QUANTLAB_CORS_ORIGINS must list the Vercel origin, or every call is
  #      blocked by the browser. It is required below, not optional.
  #   2. QUANTLAB_SITE_ADDRESS must be a real hostname, not an IP. Vercel serves
  #      the SPA over HTTPS and browsers refuse mixed content, so the API has to
  #      be HTTPS too -- and no certificate authority issues for a bare IP.
  # --------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    environment:
      QUANTLAB_SITE_ADDRESS: ${QUANTLAB_SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - quantlab-caddy-data:/data     # certificates and ACME account keys
      - quantlab-caddy-config:/config
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"                 # HTTP/3
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
    logging: *logging
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Schema owner. Runs to completion on every deploy, before the new backend
  # is allowed to serve. Shares the ingest image (same Dockerfile) -- pin the
  # same tag or the two drift and this one applies an out-of-date schema.
  # --------------------------------------------------------------------------
  migrate:
    image: ${QUANTLAB_INGEST_IMAGE:?set QUANTLAB_INGEST_IMAGE in .env}
    command: ["migrate"]
    environment:
      QUANTLAB_DB_URL: ${QUANTLAB_DB_URL:?set QUANTLAB_DB_URL in .env}
      QUANTLAB_CH_URL: ${QUANTLAB_CH_URL:?set QUANTLAB_CH_URL in .env}
      PGPASSWORD: ${QUANTLAB_PG_PASSWORD:?}
      QUANTLAB_CH_PASSWORD: ${QUANTLAB_CH_PASSWORD:?}
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    logging: *logging
    restart: "no"

  # --------------------------------------------------------------------------
  # Historical data ingest. Never part of `up` -- it reaches the network, so it
  # runs on demand (`make prod-ingest SYMBOLS="AAPL.US"` from your laptop, or
  # `docker compose run --rm ingest ...` on the VM).
  # --------------------------------------------------------------------------
  ingest:
    image: ${QUANTLAB_INGEST_IMAGE:?set QUANTLAB_INGEST_IMAGE in .env}
    profiles: ["ingest"]
    environment:
      QUANTLAB_DB_URL: ${QUANTLAB_DB_URL}
      QUANTLAB_CH_URL: ${QUANTLAB_CH_URL}
      PGPASSWORD: ${QUANTLAB_PG_PASSWORD}
      QUANTLAB_CH_PASSWORD: ${QUANTLAB_CH_PASSWORD}
      QUANTLAB_HOME: /var/lib/quantlab
      QUANTLAB_USER_AGENT: ${QUANTLAB_USER_AGENT:-quantlab/0.1 (research)}
      SEC_USER_AGENT: ${SEC_USER_AGENT:-}
      FRED_API_KEY: ${FRED_API_KEY:-}
      COMPANIES_HOUSE_API_KEY: ${COMPANIES_HOUSE_API_KEY:-}
    volumes:
      - quantlab-cache:/var/lib/quantlab
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2048M
    logging: *logging
    restart: "no"

  # One-shot, as root: hand /data to the image's non-root `quantlab` user.
  #
  # The Dockerfile's `chown /data` only reaches a volume that is created
  # empty from the image. quantlab-data predates the image going non-root, so
  # its database was still owned by root: the backend could read it -- so a
  # wrong password still got a clean 401 -- but not write it, and every
  # *successful* sign-in died with "attempt to write a readonly database" when
  # it stored the session. Re-asserting ownership on every deploy costs a
  # second and makes the volume's history irrelevant.
  data-perms:
    image: ${QUANTLAB_BACKEND_IMAGE:?set QUANTLAB_BACKEND_IMAGE in .env}
    user: "0:0"
    entrypoint: ["chown", "-R", "quantlab:quantlab", "/data"]
    volumes:
      - quantlab-data:/data
    logging: *logging
    restart: "no"

  backend:
    image: ${QUANTLAB_BACKEND_IMAGE:?set QUANTLAB_BACKEND_IMAGE in .env}
    # Two workers for two vCPUs. The image's default CMD runs a single one,
    # which leaves half the machine idle under concurrent requests.
    command: >
      uvicorn quantlab.api.app:app --host 0.0.0.0 --port 8000 --workers 2
    environment:
      # With both URLs set the API serves real ingested history. Unset them and
      # it silently falls back to the synthetic SQLite demo dataset -- which is
      # exactly the failure `make check-warehouse` exists to catch.
      QUANTLAB_DB_URL: ${QUANTLAB_DB_URL}
      QUANTLAB_CH_URL: ${QUANTLAB_CH_URL}
      PGPASSWORD: ${QUANTLAB_PG_PASSWORD}
      QUANTLAB_CH_PASSWORD: ${QUANTLAB_CH_PASSWORD}
      QUANTLAB_DB: /data/quantlab.db
      QUANTLAB_DB_PATH: /data/quantlab.db
      # Required, and empty counts as missing. The SPA is on Vercel and the API
      # is here, so every browser call is cross-origin: unset this and the API
      # answers curl perfectly while the actual app sees nothing but CORS
      # errors. That failure is invisible from the server side, so it is worth
      # refusing to start over.
      QUANTLAB_CORS_ORIGINS: ${QUANTLAB_CORS_ORIGINS:?}
    volumes:
      - quantlab-data:/data
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      data-perms:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=10)",
        ]
      interval: 10s
      # /health is cached for 30 s, but its first call per process still asks
      # Postgres and ClickHouse; a 5 s ceiling on that (when they were managed
      # services an ocean away) failed a deploy whose backend was actually fine.
      timeout: 12s
      retries: 12
      # Probes failing during startup do not count toward `retries`. Was 20 s.
      start_period: 60s
    deploy:
      resources:
        limits:
          # Backtests run in-request: one large run at a time server-wide
          # (research/runner.py, sized from measurements there) plus small
          # runs and two ~60 MB workers. Was 1024M. Always-on limits now total
          # 5.8 GB of the VM's 7.9 GB (clickhouse 2.5 + postgres 1 + backend 2
          # + caddy 0.1); the one-off ingest job adds 2 if run at the same time.
          memory: 2048M
    logging: *logging
    restart: unless-stopped

  # There is no `frontend` service. The SPA is built from frontend/ and served
  # by Vercel, which deploys from this same repository on every push; running a
  # second copy here would be two builds and two deploys of one artefact. The
  # nginx image and frontend/nginx.conf still exist for local `make up`, where
  # same-origin keeps development free of CORS entirely.

volumes:
  # The database data is NOT in a named volume: it is bind-mounted from the
  # data disk (QUANTLAB_DATA_DIR) above. quantlab-chdata / quantlab-pgdata are
  # the boot-disk volumes of the first self-hosted era (pre September 2026),
  # stale since the move to managed services; no service mounts them. Remove
  # them by hand once the data disk is trusted:
  # `docker volume rm quantlab_quantlab-chdata quantlab_quantlab-pgdata`.
  quantlab-chdata:
  quantlab-pgdata:
  quantlab-cache:         # provider HTTP cache + Parquet exports
  quantlab-data:          # synthetic demo SQLite (fallback dataset)
  quantlab-caddy-data:    # TLS certificates -- losing this re-issues them
  quantlab-caddy-config:
