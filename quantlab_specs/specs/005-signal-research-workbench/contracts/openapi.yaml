openapi: 3.1.0
info:
  title: QuantLab Signal Viewer API
  version: 0.2.0
  description: >
    Typed API boundary for the QuantLab demo. This document is the authored
    single source of truth (Constitution V): the FastAPI app is validated
    against it by a contract test, and the TypeScript client is generated from
    it with openapi-typescript. All computation happens in the backend.

    Supersedes specs/002-signal-viewer-demo/contracts/openapi.yaml as the
    authored home, carrying every existing path forward unchanged and adding
    the model catalog and experiment-run paths for feature
    005-signal-research-workbench. Read paths remain read-only; running a model
    is the one state-changing operation, and it writes only to experiment
    storage, never to the seeded signal set.
servers:
  - url: /api/v1
tags:
  - name: system
  - name: instruments
  - name: signals
  - name: models
  - name: runs

paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Service health, including seed status
      responses:
        "200":
          description: Backend is up and the seeded database is reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /instruments:
    get:
      tags: [instruments]
      operationId: listInstruments
      summary: List the synthetic instrument universe
      responses:
        "200":
          description: All seeded instruments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstrumentList"

  /instruments/{symbol}/prices:
    get:
      tags: [instruments]
      operationId: getPrices
      summary: Daily OHLCV history for one instrument
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-Z]{2,8}$"
        - name: start_date
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Bars ordered ascending by date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceBarList"
        "404":
          description: Unknown symbol
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /signals:
    get:
      tags: [signals]
      operationId: listSignals
      summary: List signals with filtering, sorting, and total count
      description: >
        `total` always reflects the full result set under the active filters,
        independent of pagination, so the UI count can be checked against the
        backend (SC-004).
      parameters:
        - name: instrument
          in: query
          required: false
          schema:
            type: string
            pattern: "^[A-Z]{2,8}$"
        - name: signal_type
          in: query
          required: false
          description: Signal rule name, e.g. sma-crossover
          schema:
            type: string
        - name: direction
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Direction"
        - name: start_date
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [date_asc, date_desc]
            default: date_desc
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Filtered signals with total count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalList"
        "400":
          description: Invalid filter combination (e.g. start_date after end_date)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /models:
    get:
      tags: [models]
      operationId: listModels
      summary: Catalog of registered signal models, discovered at runtime
      description: >
        Enumerates every model currently registered in the backend plugin
        registry, with its declared parameter metadata (Constitution II).
        Registering a model MUST make it appear here with no change to this
        document's consumers.
      responses:
        "200":
          description: Registered models
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelList"

  /runs:
    post:
      tags: [runs]
      operationId: createRun
      summary: Run a model over a dataset selection
      description: >
        Validates the requested parameters against the model's declared
        metadata, resolves a warm-up window of the model's lookback_days before
        start_date, executes, and returns the completed run. Signals dated
        outside [start_date, end_date] are computed for warm-up but not
        reported. Execution is synchronous; see research.md for the scaling
        boundary this implies.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunRequest"
      responses:
        "201":
          description: Run completed (a run producing zero signals is a success)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "404":
          description: Unknown model, or an unknown symbol in the selection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: >
            Parameter outside its declared range, window shorter than the
            model's lookback, start_date after end_date, or a selection larger
            than the permitted bound. The offending field is named.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      tags: [runs]
      operationId: listRuns
      summary: List recorded runs, newest first
      parameters:
        - name: saved_only
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: When true, return only runs saved with a name.
      responses:
        "200":
          description: Recorded runs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunList"

  /runs/{run_id}:
    parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [runs]
      operationId: getRun
      summary: One run with its provenance, summary, and produced signals
      responses:
        "200":
          description: The run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunDetail"
        "404":
          description: Unknown run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      tags: [runs]
      operationId: saveRun
      summary: Name a run to keep it as a saved experiment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
      responses:
        "200":
          description: Updated run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "404":
          description: Unknown run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [runs]
      operationId: deleteRun
      summary: Delete a run and the signals it produced
      responses:
        "204":
          description: Deleted
        "404":
          description: Unknown run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  schemas:
    Health:
      type: object
      required: [status, seeded, signal_count]
      properties:
        status:
          type: string
          enum: [ok]
        seeded:
          type: boolean
          description: True once the seed step has completed
        signal_count:
          type: integer
          minimum: 0

    Direction:
      type: string
      enum: [bullish, bearish]

    Instrument:
      type: object
      required: [symbol, name, currency, regime_profile]
      properties:
        symbol:
          type: string
          example: ZZTRND
        name:
          type: string
          example: Zeno Trend Industries (synthetic)
        currency:
          type: string
          example: USD
        regime_profile:
          type: string
          enum: [trending, mean_reverting, volatile, mixed]

    InstrumentList:
      type: object
      required: [total, items]
      properties:
        total:
          type: integer
          minimum: 0
        items:
          type: array
          items:
            $ref: "#/components/schemas/Instrument"

    PriceBar:
      type: object
      required: [symbol, date, open, high, low, close, volume]
      properties:
        symbol:
          type: string
        date:
          type: string
          format: date
        open:
          type: number
        high:
          type: number
        low:
          type: number
        close:
          type: number
        volume:
          type: integer
          minimum: 0

    PriceBarList:
      type: object
      required: [total, items]
      properties:
        total:
          type: integer
          minimum: 0
        items:
          type: array
          items:
            $ref: "#/components/schemas/PriceBar"

    Signal:
      type: object
      required:
        - id
        - symbol
        - date
        - rule_name
        - rule_version
        - parameters
        - direction
        - trigger_values
        - data_window_end
      properties:
        id:
          type: integer
        symbol:
          type: string
        date:
          type: string
          format: date
          description: Signal date T; only data knowable by T was used
        rule_name:
          type: string
          example: sma-crossover
        rule_version:
          type: string
          example: 1.0.0
        parameters:
          type: object
          additionalProperties: true
          example: { fast: 20, slow: 50 }
        direction:
          $ref: "#/components/schemas/Direction"
        trigger_values:
          type: object
          additionalProperties: true
          description: Indicator values that fired the rule
          example: { sma_fast: 101.2, sma_slow: 99.8 }
        data_window_end:
          type: string
          format: date
          description: Latest bar date used as input; always <= date (Constitution VII)

    SignalList:
      type: object
      required: [total, items]
      properties:
        total:
          type: integer
          minimum: 0
          description: Total signals matching the active filters (pre-pagination)
        items:
          type: array
          items:
            $ref: "#/components/schemas/Signal"

    Error:
      type: object
      required: [detail]
      properties:
        detail:
          type: string

    ParamSpec:
      type: object
      additionalProperties: false
      required: [name, type, default]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [int, float, bool, enum]
        default: {}
        minimum:
          type: number
          nullable: true
          description: Inclusive lower bound; numeric types only.
        maximum:
          type: number
          nullable: true
          description: Inclusive upper bound; numeric types only.
        choices:
          type: array
          nullable: true
          items: {}
          description: Permitted values; required when type is enum.
        description:
          type: string

    Model:
      type: object
      additionalProperties: false
      required: [name, version, parameters, lookback_days, scale_class, direction_semantics]
      properties:
        name:
          type: string
          example: sma-crossover
        version:
          type: string
          example: 1.0.0
        parameters:
          type: array
          items:
            $ref: "#/components/schemas/ParamSpec"
        lookback_days:
          type: integer
          minimum: 1
          description: Bars of history the model needs before it can emit.
        scale_class:
          type: string
          enum: [scale_free, price_scaled]
        direction_semantics:
          type: string

    ModelList:
      type: object
      additionalProperties: false
      required: [total, items]
      properties:
        total:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/Model"

    RunRequest:
      type: object
      additionalProperties: false
      required: [model_name, symbols, start_date, end_date]
      properties:
        model_name:
          type: string
        model_version:
          type: string
          description: Omit to use the highest registered version.
        parameters:
          type: object
          additionalProperties: true
          description: >
            Overrides only. Omitted parameters take the model's declared
            default; the merged result is recorded as the run's effective
            parameters.
        symbols:
          type: array
          minItems: 1
          items:
            type: string
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date

    RunCoverage:
      type: object
      additionalProperties: false
      required: [instruments_requested, instruments_with_data, instruments_full_warmup]
      properties:
        instruments_requested:
          type: integer
          minimum: 1
        instruments_with_data:
          type: integer
          minimum: 0
          description: How many requested instruments had bars in the window.
        instruments_full_warmup:
          type: integer
          minimum: 0
          description: >
            How many had the model's full lookback before start_date. The
            remainder may under-report early in the window.

    Run:
      type: object
      additionalProperties: false
      required:
        - id
        - model_name
        - model_version
        - parameters
        - symbols
        - start_date
        - end_date
        - status
        - created_at
        - signal_count
        - coverage
      properties:
        id:
          type: string
        name:
          type: string
          nullable: true
          description: Set when saved as a named experiment; null otherwise.
        model_name:
          type: string
        model_version:
          type: string
        parameters:
          type: object
          additionalProperties: true
          description: Effective parameters (declared defaults merged with overrides).
        symbols:
          type: array
          items:
            type: string
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        status:
          type: string
          enum: [completed, failed]
        error:
          type: string
          nullable: true
          description: Present when status is failed.
        created_at:
          type: string
          format: date-time
        signal_count:
          type: integer
          minimum: 0
          description: Zero is a valid result, not a failure.
        coverage:
          $ref: "#/components/schemas/RunCoverage"
        model_available:
          type: boolean
          description: >
            False when the recorded model/version is no longer registered; the
            run stays readable but is not re-runnable.

    RunList:
      type: object
      additionalProperties: false
      required: [total, items]
      properties:
        total:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/Run"

    ExperimentSignal:
      type: object
      additionalProperties: false
      required: [symbol, date, direction, trigger_values, data_window_end]
      properties:
        symbol:
          type: string
        date:
          type: string
          format: date
        direction:
          $ref: "#/components/schemas/Direction"
        trigger_values:
          type: object
          additionalProperties: true
        data_window_end:
          type: string
          format: date
          description: >
            Latest bar date used as input; always <= date (point-in-time proof,
            Constitution VII).

    RunDetail:
      allOf:
        - $ref: "#/components/schemas/Run"
        - type: object
          required: [signals]
          properties:
            signals:
              type: array
              items:
                $ref: "#/components/schemas/ExperimentSignal"
